    if(conceptComp(n.code,'v1')===0 && !srcSet.has(n.code)) return false;
    return true;
  });
  const rightNodes = DATA.v2.filter(n=>
    !(conceptComp(n.code,'v2')===0 && !tgtSet.has(n.code)));

  const place=(nodes,side)=>{
    const pos={}; let y=TOP, prev=null;
    nodes.forEach(n=>{
      if(prev && n.sub!==prev) y+=SUBGAP;
      const h=Math.max(3, conceptComp(n.code,side)*UNIT);
      pos[n.code]={y,h}; y+=h+GAP; prev=n.sub;
    });
    return {pos,end:y};
  };
  const L=place(leftNodes,'v1'), R=place(rightNodes,'v2');
  return {links,leftNodes,rightNodes,L,R,
          height:Math.max(L.end,R.end)+28,
          width:LEFTPAD+COLW+MIDW+COLW+RIGHTPAD};
}

function render(){
  document.getElementById('diagram').style.display = state.view==='d'?'':'none';
  document.getElementById('tablewrap').classList.toggle('on',state.view==='t');
  if(state.view==='t'){ renderTable(); return; }
  drawDiagram();
}

function drawDiagram(){
  if(typeof d3==='undefined'){
    document.getElementById('diagram').innerHTML=
      '<p style="padding:1rem;color:var(--muted)">The diagram library could not load. '+
      'Use the Table view, which shows the same connections.</p>';
    return;
  }
  const {links,leftNodes,rightNodes,L,R,height,width}=buildLayout();
  const host=d3.select('#diagram').html('');
  const svg=host.append('svg').attr('width',width).attr('height',height)
    .attr('role','img')
    .attr('aria-label',`Flow diagram linking ${leftNodes.length} Version 1 concepts to ${rightNodes.length} Version 2 concepts. A table view with the same data is available from the toolbar.`);

  const defs=svg.append('defs');
  const hp=defs.append('pattern').attr('id','hatch').attr('width',5).attr('height',5)
    .attr('patternTransform','rotate(45)').attr('patternUnits','userSpaceOnUse');
  hp.append('line').attr('x1',0).attr('y1',0).attr('x2',0).attr('y2',5)
    .attr('stroke','#8e9aa6').attr('stroke-width',1).attr('stroke-opacity',.35);


  const xL=LEFTPAD, xR=LEFTPAD+COLW+MIDW;
  const fwd = state.dir==='f';

  /* column headers */
  const head=(x,t,s)=>{
    svg.append('text').attr('x',x).attr('y',18).attr('font-family','Spectral,serif')
      .attr('font-size',14).attr('fill','#19212b').text(t);
    svg.append('text').attr('x',x).attr('y',33).attr('font-size',10.5)
      .attr('fill','#8e9aa6').text(s);
  };
  head(xL-LEFTPAD+2,'Version 1',`${leftNodes.length} concepts`);
  head(xR+COLW+8,'Version 2',`${rightNodes.length} concepts`);

  /* --- ribbons --- */
  const used1={},used2={};
  const ribbons=links.map(l=>{
    const a=L.pos[l.s], b=R.pos[l.t];
    if(!a||!b) return null;
    // Use the sum of all link weights for this node as denominator
    // so ribbons always fill the full bar (no unaccounted gap)
    const srcSum=links.filter(x=>x.s===l.s).reduce((t,x)=>t+x.w,0)||l.w;
    const tgtSum=links.filter(x=>x.t===l.t).reduce((t,x)=>t+x.w,0)||l.w;
    const srcTot=Math.max(srcSum, conceptComp(l.s,'v1')||1);
    const tgtTot=Math.max(tgtSum, conceptComp(l.t,'v2')||1);
    const sh=a.h*(l.w/srcTot);
    const th=b.h*(l.w/tgtTot);
    const sy=a.y+(used1[l.s]||0), ty=b.y+(used2[l.t]||0);
    used1[l.s]=(used1[l.s]||0)+sh; used2[l.t]=(used2[l.t]||0)+th;
    return {...l,sy,sy1:sy+sh,ty,ty1:ty+th};
  }).filter(Boolean);

  const path=r=>{
    const x0=xL+COLW, x1=xR, cx=(x0+x1)/2;
    return `M${x0},${r.sy} C${cx},${r.sy} ${cx},${r.ty} ${x1},${r.ty}
            L${x1},${r.ty1} C${cx},${r.ty1} ${cx},${r.sy1} ${x0},${r.sy1} Z`;
  };

  const rib=svg.append('g').selectAll('path').data(ribbons).join('path')
    .attr('d',path)
    .attr('fill',r=>HEX[fwd?r.s[0]:r.t[0]])
    .attr('fill-opacity',.22)
    .attr('stroke',r=> r.s[0]!==r.t[0] ? HEX[r.t[0]] : 'none')
    .attr('stroke-opacity',.35).attr('stroke-width',.6)
    .style('cursor','pointer').attr('tabindex',0)
    .attr('aria-label',r=>`${r.s} ${v1By[r.s].name} to ${r.t} ${v2By[r.t].name}, ${r.w} competencies`)
    .on('mouseenter',(e,r)=>{ hi(r); tipShow(e,
        `<b>${r.s} &rarr; ${r.t}</b><br>${v1By[r.s].name}<br><i>becomes</i> ${v2By[r.t].name}<br>
         ${r.w} competenc${r.w===1?'y':'ies'}${r.s[0]!==r.t[0]?`<br><i>moves from strand ${r.s[0]} to ${r.t[0]}</i>`:''}`);})
    .on('mousemove',tipMove)
    .on('mouseleave',()=>{unhi();tipHide()})
    .on('click',(e,r)=>{e.stopPropagation();openLink(r)})
    .on('focus',(e,r)=>hi(r)).on('blur',unhi)
    .on('keydown',(e,r)=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openLink(r)}});

  /* --- bars --- */
  function bars(nodes,pos,x,side){
    const g=svg.append('g').selectAll('g').data(nodes).join('g');
    g.append('rect')
      .attr('x',x).attr('y',n=>pos[n.code].y).attr('width',COLW)
      .attr('height',n=>pos[n.code].h).attr('rx',1)
      .attr('fill',n=>HEX[n.strand]).attr('fill-opacity',.85);

    /* unaccounted segment — hidden since ribbons now fill bars proportionally */

    g.append('rect')
      .attr('x',x-2).attr('y',n=>pos[n.code].y-1).attr('width',COLW+4)
      .attr('height',n=>pos[n.code].h+2).attr('fill','transparent')
      .style('cursor','pointer').attr('tabindex',0).attr('role','button')
      .attr('aria-label',n=>`${n.code} ${n.name}, ${conceptComp(n.code,side)} competencies`)
      .on('mouseenter',(e,n)=>{hiNode(n.code,side);tipShow(e,nodeTip(n,side))})
      .on('mousemove',tipMove).on('mouseleave',()=>{unhi();tipHide()})
      .on('click',(e,n)=>{e.stopPropagation(); side==='v1'?openV1(n.code):openV2(n.code)})
      .on('focus',(e,n)=>hiNode(n.code,side)).on('blur',unhi)
      .on('keydown',(e,n)=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();
        side==='v1'?openV1(n.code):openV2(n.code)}});

    /* labels */
    const anchor = side==='v1'?'end':'start';
    const codeX  = side==='v1'? x-5 : x+COLW+5;
    const nameX  = side==='v1'? x-46 : x+COLW+46;
    // available pixel width for name text
    const nameW  = side==='v1'? LEFTPAD-52 : RIGHTPAD-52;
    // approx chars that fit at 9.5px (roughly 5.8px per char)
    const maxCh  = Math.floor(nameW/5.8);
    g.append('text').attr('x',codeX).attr('y',n=>pos[n.code].y+pos[n.code].h/2)
      .attr('text-anchor',anchor).attr('dominant-baseline','middle')
      .attr('class','code').attr('font-size',9.5).attr('fill',n=>HEX[n.strand])
      .text(n=>n.code);
    g.append('text').attr('x',nameX).attr('y',n=>pos[n.code].y+pos[n.code].h/2)
      .attr('text-anchor',anchor).attr('dominant-baseline','middle')
      .attr('font-size',9.5).attr('fill','#5d6b7a')
      .text(n=>n.name.length>maxCh ? n.name.slice(0,maxCh-1)+'…' : n.name);

    /* orphan marker */
    g.filter(n=> side==='v1' ? DATA.orphans.includes(n.code) : false)
      .append('circle').attr('cx',x+COLW+4.5).attr('cy',n=>pos[n.code].y+pos[n.code].h/2)
      .attr('r',2.2).attr('fill','#b0362c');
    return g;
  }
  const gL=bars(leftNodes,L.pos,xL,'v1');
  const gR=bars(rightNodes,R.pos,xR,'v2');

  /* substrand brackets */
  function brackets(nodes,pos,x,side){
    const groups=d3.group(nodes,n=>n.sub);
    groups.forEach((ns,sub)=>{
      const y0=pos[ns[0].code].y, p=pos[ns[ns.length-1].code];
      const y1=p.y+p.h;
      const col=HEX[sub[0]];

      // Subtle full-width tinted band behind the substrand group
      svg.insert('rect','g')
        .attr('x',0).attr('y',y0-2)
        .attr('width',width).attr('height',y1-y0+4)
        .attr('fill',col).attr('fill-opacity',.03)
        .attr('rx',2);

      // Thin accent line along the outer edge of the bar column
      const lx = side==='v1' ? x-4 : x+COLW+4;
      svg.append('line')
        .attr('x1',lx).attr('x2',lx).attr('y1',y0+1).attr('y2',y1-1)
        .attr('stroke',col).attr('stroke-opacity',.35)
        .attr('stroke-width',2).attr('stroke-linecap','round');

      // Substrand name as a horizontal label directly on the tinted band,
      // placed at the TOP of the group so it reads naturally and never overlaps
      // the concept name text (which is centered on each node's midpoint)
      const name=(side==='v1'?DATA.v1Sub[sub]:(DATA.v2Sub[sub]||{}).name)||'';
      const labelX = side==='v1' ? x-5 : x+COLW+5;
      const anchor  = side==='v1' ? 'end' : 'start';
      // Only show if the group is tall enough that the top label won't collide with the first node's midpoint
      const firstMid = pos[ns[0].code].y + pos[ns[0].code].h/2;
      if(firstMid - y0 > 10){
        svg.append('text')
          .attr('x', labelX)
          .attr('y', y0 - 3)
          .attr('text-anchor', anchor)
          .attr('dominant-baseline','auto')
          .attr('font-size', 8)
          .attr('font-weight', 600)
          .attr('fill', col)
          .attr('fill-opacity', .55)
          .attr('letter-spacing','0.05em')
          .text(name.toUpperCase().slice(0,32));
      }
    });
  }
  brackets(leftNodes,L.pos,xL,'v1');
  brackets(rightNodes,R.pos,xR,'v2');

  /* highlight helpers */
  function hi(r){
    rib.attr('fill-opacity',d=>d===r?.62:.05);
    gL.selectAll('text').attr('fill-opacity',n=>n.code===r.s?1:.25);
    gR.selectAll('text').attr('fill-opacity',n=>n.code===r.t?1:.25);
  }
  function hiNode(code,side){
    rib.attr('fill-opacity',d=>(side==='v1'?d.s:d.t)===code?.62:.05);
    gL.selectAll('text').attr('fill-opacity',n=> side==='v1'
      ? (n.code===code?1:.25)
      : (links.some(l=>l.t===code&&l.s===n.code)?1:.25));
    gR.selectAll('text').attr('fill-opacity',n=> side==='v2'
      ? (n.code===code?1:.25)
      : (links.some(l=>l.s===code&&l.t===n.code)?1:.25));
  }
  function unhi(){
    rib.attr('fill-opacity',.22);
    gL.selectAll('text').attr('fill-opacity',1);
    gR.selectAll('text').attr('fill-opacity',1);
  }
  window.__hiNode=hiNode; window.__unhi=unhi;
  svg.on('click',unhi);

  if(state.focus){
    const f=state.focus;
    if(L.pos[f]) hiNode(f,'v1'); else if(R.pos[f]) hiNode(f,'v2');
  }
}

function nodeTip(n,side){
  const c=conceptComp(n.code,side);
  if(side==='v1'){
    const out=activeLinks().filter(l=>l.s===n.code);
    const orph=DATA.orphans.includes(n.code);
    const tot=out.reduce((s,l)=>s+l.w,0);
    return `<b>${n.code} &middot; ${n.name}</b><br>Version 1 &middot; ${c} competenc${c===1?'y':'ies'}<br>`+
      (orph? `<i>Not carried into Version 2</i>`
           : `<i>Carries into ${tot} competenc${tot===1?'y':'ies'} across ${out.length} concept${out.length===1?'':'s'}</i>`);
  }
  const ins=activeLinks().filter(l=>l.t===n.code);
  return `<b>${n.code} &middot; ${n.name}</b><br>Version 2 &middot; ${c} competenc${c===1?'y':'ies'}<br>`+
    `<i>Draws on ${ins.length} Version 1 concept${ins.length===1?'':'s'}</i>`;
}

/* ============================================================
   drawer
   ============================================================ */
function setHash(h){ try{ history.replaceState(null,'',h); }catch(e){} }
function getHash(){ try{ return location.hash||''; }catch(e){ return ''; } }

const drawer=document.getElementById('drawer');
const dTitle=document.getElementById('dTitle');
const dSub=document.getElementById('dSub');
const dBody=document.getElementById('dBody');
document.getElementById('dClose').onclick=closeDrawer;
function closeDrawer(){ drawer.classList.remove('on'); state.focus=null;
  setHash(location.pathname||'#'); if(window.__unhi)window.__unhi(); }
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});

function bandChart(gb,color){
  const m=Math.max(...gb,1);
  return `<div class="bands">${gb.map((v,i)=>
    `<div><i style="height:${Math.max(2,v/m*22)}px;background:${color};opacity:${v?.8:.15}"></i>
     <em>${BANDS[i]}</em></div>`).join('')}</div>`;
}
const tagFor=t=> t==='Revised'?'<span class="tag t-rev">revised</span>'
  : t==='Unchanged'?'<span class="tag t-unc">unchanged</span>'
  : t==='Added'?'<span class="tag t-new">added</span>':'';

function compList(ids){
  return ids.map(id=>{
    const c=DATA.comps.find(x=>x.id===id); if(!c) return '';
    return `<div class="cmp-item">
      <div class="cmp-id code">${c.id}${tagFor(c.change)}</div>
      <div class="cmp-tx">${esc(c.text)}</div>
      ${c.from && c.from.length
        ? `<div class="cmp-src">From V1 ${c.from.map(s=>`<span class="code">${s}</span>`).join(', ')}</div>`
        : ''}
      ${c.why ? `<div class="why">${esc(c.why)}</div>` : ''}
    </div>`;
  }).join('');
}
const esc=s=>String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));

function openV1(code){
  const n=v1By[code];
  const outs=DATA.links.filter(l=>l.s===code);
  const orph=DATA.orphans.includes(code);
  state.focus=code; setHash('#v1='+code);
  dTitle.textContent=`${code} · ${n.name}`;
  dSub.innerHTML=`Version 1 &middot; Strand ${n.strand} &middot; ${n.subName} &middot; ${n.comp} competencies`;
  dBody.innerHTML =
    bandChart(n.gb,HEX[n.strand])
    + (orph
      ? `<div class="note"><b>Not carried into Version 2.</b> No Version&nbsp;2 concept covers
         the ground of this concept&rsquo;s ${n.comp} competencies.</div>`
      : `<div class="sect">Becomes, in Version 2</div>` + outs.map(l=>{
          const t=v2By[l.t];
          return `<div class="row">
            <div class="row-h">
              <span class="code" style="color:${HEX[t.strand]}">${t.code}</span>
              <span class="n">${l.n} competenc${l.n===1?'y':'ies'}${l.s[0]!==l.t[0]?' · strand '+l.s[0]+'→'+l.t[0]:''}</span>
            </div>
            <div class="row-name">${esc(t.name)}</div>
            <button class="more" data-ids="${l.ids.join('|')}">Show the competencies</button>
            <div class="cmp"></div>
          </div>`;
        }).join(''))
    + `<div class="sect">Add to a migration list</div>
       <button class="chip ${state.basket.has(code)?'act':''}" id="addBtn">
         ${state.basket.has(code)?'Remove from list':'Add this concept'}</button>`;
  wireDrawer(code);
  drawer.classList.add('on');
  if(window.__hiNode)window.__hiNode(code,'v1');
}

function openV2(code){
  const n=v2By[code];
  const ins=DATA.links.filter(l=>l.t===code);
  state.focus=code; setHash('#v2='+code);
  dTitle.textContent=`${code} · ${n.name}`;
  dSub.innerHTML=`Version 2 &middot; Strand ${n.strand} &middot; ${n.subName} &middot; ${n.comp} competencies`;
  dBody.innerHTML =
    (n.desc?`<div class="desc">${esc(n.desc)}</div>`:'')
    + bandChart(n.gb,HEX[n.strand])
    + `<div class="sect">Drawn from, in Version 1</div>`
    + (ins.length? ins.map(l=>{
        const s=v1By[l.s];
        return `<div class="row">
          <div class="row-h">
            <span class="code" style="color:${HEX[s.strand]}">${s.code}</span>
            <span class="n">${l.n} competenc${l.n===1?'y':'ies'}${l.s[0]!==l.t[0]?' · strand '+l.s[0]+'→'+l.t[0]:''}</span>
          </div>
          <div class="row-name">${esc(s.name)}</div>
          <button class="more" data-ids="${l.ids.join('|')}">Show the competencies</button>
          <div class="cmp"></div>
        </div>`;}).join('')
      : `<div class="note">No Version&nbsp;1 source is recorded for any competency in this concept.</div>`)
    + `<div class="sect">All competencies</div>
       <button class="more" data-ids="${compsByConcept[code].map(c=>c.id).join('|')}">Show all ${n.comp}</button>
       <div class="cmp"></div>`;
  wireDrawer(code);
  drawer.classList.add('on');
  if(window.__hiNode)window.__hiNode(code,'v2');
}

function openLink(r){
  const s=v1By[r.s], t=v2By[r.t];
  dTitle.textContent=`${r.s} → ${r.t}`;
  dSub.innerHTML=`${r.w} competenc${r.w===1?'y':'ies'}${r.s[0]!==r.t[0]?` &middot; moves from strand ${r.s[0]} to ${r.t[0]}`:''}`;
  dBody.innerHTML=
    `<div class="row"><div class="row-h"><span class="code" style="color:${HEX[s.strand]}">${s.code}</span>
       <span class="n">Version 1</span></div><div class="row-name">${esc(s.name)}</div></div>
     <div class="row"><div class="row-h"><span class="code" style="color:${HEX[t.strand]}">${t.code}</span>
       <span class="n">Version 2</span></div><div class="row-name">${esc(t.name)}</div>
       ${t.desc?`<div class="cmp-tx" style="color:var(--muted);margin-top:.35rem">${esc(t.desc)}</div>`:''}</div>
     <div class="sect">The competencies behind this connection</div>
     <div class="cmp on">${compList(r.ids)}</div>`;
  drawer.classList.add('on');
}

function wireDrawer(code){
  dBody.querySelectorAll('button.more').forEach(b=>{
    b.onclick=()=>{
      const box=b.parentElement.querySelector('.cmp');
      if(box.classList.contains('on')){box.classList.remove('on');box.innerHTML='';
        b.textContent=b.textContent.replace('Hide','Show');return;}
      box.innerHTML=compList(b.dataset.ids.split('|'));
      box.classList.add('on'); b.textContent=b.textContent.replace('Show','Hide');
    };
  });
  const ab=dBody.querySelector('#addBtn');
  if(ab) ab.onclick=()=>{ state.basket.has(code)?state.basket.delete(code):state.basket.add(code);
    updateBasket(); openV1(code); };
}

/* ============================================================
   migration list
   ============================================================ */
const basket=document.getElementById('basket');
function updateBasket(){
  const n=state.basket.size;
  basket.classList.toggle('on',n>0);
  document.getElementById('basketN').textContent=
    `${n} V1 concept${n===1?'':'s'} on your migration list`;
}
document.getElementById('basketClear').onclick=()=>{state.basket.clear();updateBasket()};
document.getElementById('basketCsv').onclick=()=>{
  const rows=[['V1 code','V1 name','V1 competencies','V2 code','V2 name','Competencies carried','Strand change','V2 competency ids']];
  state.basket.forEach(code=>{
    const s=v1By[code], outs=DATA.links.filter(l=>l.s===code);
    if(!outs.length) rows.push([code,s.name,s.comp,'','',0,'not carried into Version 2','']);
    outs.forEach(l=>rows.push([code,s.name,s.comp,l.t,v2By[l.t].name,l.n,
      l.s[0]!==l.t[0]?`${l.s[0]} to ${l.t[0]}`:'same strand',l.ids.join(' ')]));
  });
  const csv=rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  try{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
    a.download='dslp-v1-to-v2-migration.csv';
    document.body.appendChild(a); a.click(); a.remove();
  }catch(e){
    const w=window.open(''); if(w){ w.document.write('<pre>'+csv.replace(/</g,'&lt;')+'</pre>'); }
  }
};

/* ============================================================
   table view
   ============================================================ */
function renderTable(){
  const links=activeLinks();
  const rows=[];
  DATA.v1.forEach(s=>{
    const outs=links.filter(l=>l.s===s.code);
    if(!outs.length){
      if(DATA.orphans.includes(s.code))
        rows.push([s.code,s.name,s.comp,'—','Not carried into Version 2','0','—']);
    } else outs.forEach(l=>{
      const t=v2By[l.t];
      rows.push([s.code,s.name,conceptComp(s.code,'v1'),t.code,t.name,l.w,
        l.s[0]!==l.t[0]?`${l.s[0]} → ${l.t[0]}`:'—']);
    });
  });
  document.getElementById('tablewrap').innerHTML=
    `<table><caption>Every connection in the crosswalk${state.band!=='all'?`, limited to grade band ${state.band}`:''}. ${rows.length} rows.</caption>
     <thead><tr>${['V1','Version 1 concept','V1 comps','V2','Version 2 concept','Carried','Strand']
       .map(h=>`<th scope="col">${h}</th>`).join('')}</tr></thead>
     <tbody>${rows.map(r=>`<tr>
       <td class="code num">${r[0]}</td><td>${esc(r[1])}</td><td class="num">${r[2]}</td>
       <td class="code num">${r[3]}</td><td>${esc(r[4])}</td><td class="num">${r[5]}</td>
       <td class="num">${r[6]}</td></tr>`).join('')}</tbody></table>`;
}

/* ============================================================
   search
   ============================================================ */
const q=document.getElementById('q'), sugg=document.getElementById('sugg');
const index=[...DATA.v1.map(n=>({...n,v:'V1'})),...DATA.v2.map(n=>({...n,v:'V2'}))];
let curIdx=-1;
q.addEventListener('input',()=>{
  const s=q.value.trim().toLowerCase();
  if(!s){sugg.classList.remove('on');return;}
  const hits=index.filter(n=>n.code.toLowerCase().includes(s)||n.name.toLowerCase().includes(s))
    .slice(0,14);
  sugg.innerHTML=hits.map((n,i)=>
    `<button data-v="${n.v}" data-code="${n.code}" role="option">
      <span class="code" style="color:${HEX[n.strand]}">${n.code}</span> ${esc(n.name)}
      <span class="v">${n.v}</span></button>`).join('')
    || `<button disabled style="color:var(--faint)">No concept matches that</button>`;
  sugg.classList.add('on'); curIdx=-1;
});
sugg.addEventListener('click',e=>{
  const b=e.target.closest('button[data-code]'); if(!b)return;
  sugg.classList.remove('on'); q.value='';
  b.dataset.v==='V1'?openV1(b.dataset.code):openV2(b.dataset.code);
});
q.addEventListener('keydown',e=>{
  const opts=[...sugg.querySelectorAll('button[data-code]')];
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    e.preventDefault(); if(!opts.length)return;
    curIdx=(curIdx+(e.key==='ArrowDown'?1:-1)+opts.length)%opts.length;
    opts.forEach((o,i)=>o.classList.toggle('cur',i===curIdx));
    opts[curIdx].scrollIntoView({block:'nearest'});
  } else if(e.key==='Enter'){
    const pick=opts[curIdx]||opts[0]; if(pick){e.preventDefault();pick.click()}
  } else if(e.key==='Escape'){ sugg.classList.remove('on') }
});
document.addEventListener('click',e=>{ if(!e.target.closest('.find')) sugg.classList.remove('on') });

/* ============================================================
   toolbar wiring
   ============================================================ */
const pair=(a,b,fn)=>{
  const A=document.getElementById(a),B=document.getElementById(b);
  A.onclick=()=>{A.setAttribute('aria-pressed','true');B.setAttribute('aria-pressed','false');fn('a')};
  B.onclick=()=>{B.setAttribute('aria-pressed','true');A.setAttribute('aria-pressed','false');fn('b')};
};
pair('dirF','dirR',v=>{state.dir=v==='a'?'f':'r';render()});
pair('viewD','viewT',v=>{state.view=v==='a'?'d':'t';render()});


/* ============================================================
   tooltip
   ============================================================ */
const tip=document.getElementById('tip');
function tipShow(e,html){tip.innerHTML=html;tip.classList.add('on');tipMove(e)}
function tipMove(e){
  const x=e.clientX+14,y=e.clientY+12;
  tip.style.left=(x+tip.offsetWidth>innerWidth?innerWidth-tip.offsetWidth-8:x)+'px';
  tip.style.top=(y+tip.offsetHeight>innerHeight?e.clientY-tip.offsetHeight-10:y)+'px';
}
function tipHide(){tip.classList.remove('on')}

/* ============================================================
   boot
   ============================================================ */
render();
updateBasket();
const h=getHash().match(/^#(v1|v2)=([A-E]\.\d\.\d)$/);
if(h) h[1]==='v1'?openV1(h[2]):openV2(h[2]);
addEventListener('resize',()=>{ if(state.view==='d') drawDiagram(); });
</script>
