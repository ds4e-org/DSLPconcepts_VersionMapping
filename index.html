<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Science Learning Progressions · DS4E</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --paper:#f5f6f7; --card:#fff; --ink:#19212b; --muted:#5d6b7a; --faint:#8e9aa6;
  --rule:#d9dfe5; --rule2:#eceff2;
  --A:#2f6f8f; --B:#44764f; --C:#9a6b1f; --D:#9c4337; --E:#59497f;
  --flag:#b0362c;
  --focus:#2f6f8f;
}
html{font-size:16px}
body{background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;
  font-size:.875rem;line-height:1.55;-webkit-font-smoothing:antialiased}
.code{font-variant-numeric:tabular-nums;letter-spacing:.01em;font-weight:500}
a{color:var(--A)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:2px}

/* ---------- masthead ---------- */
.masthead{padding:1.4rem 2rem 1rem;max-width:78rem;margin:0 auto}
.masthead h1{font-family:Spectral,Georgia,serif;font-weight:300;font-size:2.1rem;
  line-height:1.12;letter-spacing:-.015em;max-width:24ch}
.lede{font-family:Spectral,Georgia,serif;font-size:1.0625rem;line-height:1.65;
  color:var(--muted);max-width:62ch;margin-top:.9rem}
.tally{display:flex;flex-wrap:wrap;gap:0 2.5rem;margin-top:1.6rem;
  border-top:1px solid var(--rule);padding-top:1rem}
.tally div{padding:.2rem 0}
.tally b{display:block;font-family:Spectral,serif;font-weight:400;font-size:1.5rem;
  line-height:1.1;font-variant-numeric:tabular-nums}
.tally span{font-size:.75rem;color:var(--faint)}

/* ---------- toolbar ---------- */
.toolbar{position:sticky;top:0;z-index:30;background:rgba(245,246,247,.94);
  backdrop-filter:blur(6px);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.toolbar-in{max-width:78rem;margin:0 auto;padding:.65rem 2rem;display:flex;
  align-items:center;gap:.9rem;flex-wrap:wrap}
.find{position:relative;flex:1 1 17rem;max-width:24rem}
.find input{width:100%;padding:.4rem .6rem;border:1px solid var(--rule);border-radius:3px;
  background:var(--card);font:inherit;color:var(--ink)}
.find input::placeholder{color:var(--faint)}
.sugg{position:absolute;top:calc(100% + 3px);left:0;right:0;background:var(--card);
  border:1px solid var(--rule);border-radius:3px;max-height:17rem;overflow-y:auto;
  box-shadow:0 6px 18px rgba(25,33,43,.12);display:none;z-index:40}
.sugg.on{display:block}
.sugg button{display:block;width:100%;text-align:left;padding:.4rem .6rem;border:0;
  background:none;font:inherit;cursor:pointer;border-bottom:1px solid var(--rule2)}
.sugg button:hover,.sugg button.cur{background:#eef2f5}
.sugg .v{font-size:.7rem;color:var(--faint)}
.seg{display:flex;border:1px solid var(--rule);border-radius:3px;overflow:hidden}
.seg button{border:0;background:var(--card);font:inherit;font-size:.78rem;
  padding:.35rem .7rem;cursor:pointer;color:var(--muted)}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.lbl{font-size:.72rem;color:var(--faint)}
.chip{border:1px solid var(--rule);background:var(--card);border-radius:3px;
  padding:.3rem .55rem;font:inherit;font-size:.78rem;cursor:pointer;color:var(--muted)}
.chip[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.act{border-color:var(--ink);color:var(--ink)}

/* ---------- layout ---------- */
.stage{max-width:78rem;margin:0 auto;padding:0 2rem 4rem;position:relative}
.diagram{overflow-x:auto;padding:1.2rem 0}
svg{display:block}
.hatch-label{font-size:.72rem;color:var(--faint)}

/* ---------- drawer ---------- */
.drawer{position:fixed;top:0;right:0;width:min(30rem,100%);height:100dvh;background:var(--card);
  border-left:1px solid var(--rule);z-index:60;display:flex;flex-direction:column;
  transform:translateX(101%);transition:transform .26s cubic-bezier(.4,0,.2,1);
  box-shadow:-10px 0 30px rgba(25,33,43,.1)}
.drawer.on{transform:none}
.drawer-top{padding:1.1rem 1.2rem .85rem;border-bottom:1px solid var(--rule);
  display:flex;gap:.8rem;align-items:flex-start}
.drawer-top h2{font-family:Spectral,serif;font-weight:400;font-size:1.15rem;line-height:1.25;flex:1}
.drawer-top .sub{font-size:.72rem;color:var(--faint);margin-top:.2rem}
.x{border:1px solid var(--rule);background:none;width:1.7rem;height:1.7rem;border-radius:3px;
  cursor:pointer;color:var(--muted);font-size:1rem;line-height:1;flex-shrink:0}
.x:hover{background:var(--paper)}
.drawer-body{overflow-y:auto;padding:1.1rem 1.2rem 3rem;flex:1}
.sect{font-size:.72rem;color:var(--faint);margin:1.4rem 0 .55rem;
  border-bottom:1px solid var(--rule2);padding-bottom:.3rem}
.sect:first-child{margin-top:0}
.desc{font-family:Spectral,serif;font-size:.95rem;line-height:1.62;color:var(--muted)}
.row{border:1px solid var(--rule);border-radius:3px;padding:.6rem .7rem;margin-bottom:.5rem}
.row-h{display:flex;justify-content:space-between;gap:.6rem;align-items:baseline}
.row-h .n{font-size:.72rem;color:var(--faint);white-space:nowrap}
.row-name{font-size:.84rem;margin-top:.15rem}
.row button.more{border:0;background:none;color:var(--A);font:inherit;font-size:.74rem;
  cursor:pointer;padding:.25rem 0 0;text-decoration:underline}
.cmp{border-top:1px solid var(--rule2);margin-top:.5rem;padding-top:.5rem;display:none}
.cmp.on{display:block}
.cmp-item{margin-bottom:.7rem}
.cmp-item:last-child{margin-bottom:0}
.cmp-id{font-size:.7rem;color:var(--faint)}
.cmp-tx{font-size:.8rem;line-height:1.5;margin-top:.1rem}
.cmp-src{font-size:.7rem;color:var(--muted);margin-top:.15rem}
.tag{display:inline-block;font-size:.66rem;padding:.08rem .34rem;border-radius:2px;
  border:1px solid currentColor;margin-left:.3rem;vertical-align:.05em}
.t-rev{color:#8a6a1a}.t-unc{color:#44764f}.t-new{color:var(--flag)}
.why{font-size:.74rem;line-height:1.55;color:var(--muted);font-style:italic;margin-top:.35rem;
  padding-left:.55rem;border-left:2px solid var(--rule)}
.bands{display:flex;gap:2px;align-items:flex-end;height:2rem;margin-top:.5rem}
.bands div{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px}
.bands i{display:block;width:100%;border-radius:1px}
.bands em{font-style:normal;font-size:.6rem;color:var(--faint);font-variant-numeric:tabular-nums}
.note{font-size:.76rem;line-height:1.6;color:var(--muted);background:var(--paper);
  border-left:2px solid var(--flag);padding:.55rem .7rem;border-radius:0 3px 3px 0;margin-top:.8rem}

/* ---------- table view ---------- */
.tablewrap{display:none;padding:1rem 0 3rem}
.tablewrap.on{display:block}
table{border-collapse:collapse;width:100%;font-size:.8rem}
caption{text-align:left;font-size:.76rem;color:var(--muted);padding-bottom:.6rem}
th,td{text-align:left;padding:.42rem .6rem;border-bottom:1px solid var(--rule2);vertical-align:top}
th{font-weight:600;font-size:.72rem;color:var(--muted);border-bottom:1px solid var(--rule);
  position:sticky;top:3rem;background:var(--paper)}
tbody tr:hover{background:#eef2f5}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- basket ---------- */
.basket{position:fixed;left:1rem;bottom:1rem;z-index:50;background:var(--ink);color:#fff;
  border-radius:4px;padding:.55rem .75rem;display:none;align-items:center;gap:.7rem;
  box-shadow:0 8px 24px rgba(25,33,43,.3);font-size:.78rem}
.basket.on{display:flex}
.basket button{border:1px solid rgba(255,255,255,.35);background:none;color:#fff;font:inherit;
  font-size:.74rem;padding:.2rem .5rem;border-radius:3px;cursor:pointer}
.basket button:hover{background:rgba(255,255,255,.14)}

.tip{position:fixed;z-index:80;background:var(--ink);color:#fff;padding:.45rem .6rem;
  border-radius:3px;font-size:.76rem;line-height:1.45;max-width:20rem;pointer-events:none;
  opacity:0;transition:opacity .1s}
.tip.on{opacity:1}
.tip b{font-weight:600}
.tip i{font-style:normal;color:#aab6c2}

.legend{max-width:78rem;margin:0 auto;padding:0 2rem 1rem;display:flex;flex-wrap:wrap;
  gap:.4rem 1.4rem;font-size:.74rem;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:.4rem}
.sw{width:1.4rem;height:.6rem;border-radius:1px;flex-shrink:0}

footer{max-width:78rem;margin:0 auto;padding:1.5rem 2rem 4rem;border-top:1px solid var(--rule);
  font-size:.78rem;color:var(--muted);line-height:1.65;max-width:72ch}
footer p+p{margin-top:.6rem}

@media (max-width:860px){
  .masthead{padding:1.6rem 1.1rem 1rem}
  .masthead h1{font-size:1.6rem}
  .toolbar-in,.stage,.legend,footer{padding-left:1.1rem;padding-right:1.1rem}
  .drawer{width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  .toolbar,.drawer,.basket,.tip{display:none!important}
  body{background:#fff}
  .tablewrap{display:block!important}
  .diagram{page-break-inside:avoid}
}
</style>
</head>

<div class="legend" id="legend"></div>

,2]},{"code":"E.1.3","name":"Clear design for user interpretation","strand":"E","sub":"E.1","subName":"Representations and Dynamic Visualizations","comp":11,"gb":[1,2,2,3,3]},{"code":"E.1.4","name":"Graphical literacy","strand":"E","sub":"E.1","subName":"Representations and Dynamic Visualizations","comp":11,"gb":[2,3,2,2,2]},{"code":"E.1.5","name":"Representational fluency","strand":"E","sub":"E.1","subName":"Representations and Dynamic Visualizations","comp":9,"gb":[2,1,2,2,2]},{"code":"E.1.6","name":"Parallel visual-type construction","strand":"E","sub":"E.1","subName":"Representations and Dynamic Visualizations","comp":6,"gb":[1,1,1,1,2]},{"code":"E.2.1","name":"Connect narratives and data visualizations","strand":"E","sub":"E.2","subName":"Data Storytelling","comp":8,"gb":[2,2,2,1,1]},{"code":"E.2.2","name":"Write data stories","strand":"E","sub":"E.2","subName":"Data Storytelling","comp":16,"gb":[2,3,3,3,5]},{"code":"E.2.3","name":"Adapt storytelling","strand":"E","sub":"E.2","subName":"Data Storytelling","comp":9,"gb":[1,2,2,2,2]},{"code":"E.3.1","name":"Intent and authorship of analyses","strand":"E","sub":"E.3","subName":"Acting on Data to Benefit Society","comp":13,"gb":[1,2,3,4,3]},{"code":"E.3.2","name":"Advocacy with data arguments","strand":"E","sub":"E.3","subName":"Acting on Data to Benefit Society","comp":9,"gb":[1,2,2,2,2]},{"code":"E.3.3","name":"Civic data practices","strand":"E","sub":"E.3","subName":"Acting on Data to Benefit Society","comp":4,"gb":[0,0,0,2,2]},{"code":"E.3.4","name":"Impacts of technology use","strand":"E","sub":"E.3","subName":"Acting on Data to Benefit Society","comp":6,"gb":[1,1,1,2,1]}],"v2":[{"code":"A.1.1","name":"Recognizing Data in All of Its Forms","desc":"Recognize that data exists everywhere and can take forms beyond numbers (categories, locations, observations), and that phenomena and sources (e.g., text, image, audio) can be systematically turned into analyzable data.","sub":"A.1","strand":"A","subName":"The Data-Filled World","comp":5,"gb":[1,1,1,1,1]},{"code":"A.1.2","name":"The Power and Responsibility of Data","desc":"Recognize that data can empower discovery, decision-making, and advocacy while also posing risks such as privacy harms, algorithmic bias, and unintended consequences that demand ongoing responsibility.","sub":"A.1","strand":"A","subName":"The Data-Filled World","comp":14,"gb":[1,3,4,3,3]},{"code":"A.1.3","name":"Data, Computing, and AI Systems","desc":"Recognize that data fuels the computational and AI systems that increasingly mediate everyday life (e.g., search, recommendations, chatbots, automated decisions). Recognize that these systems depend on data to operate and improve, and articulate the limits of what they can reliably do.","sub":"A.1","strand":"A","subName":"The Data-Filled World","comp":13,"gb":[1,2,3,4,3]},{"code":"A.2.1","name":"Cultivating a Questioning Curiosity","desc":"Develop a questioning stance toward data, noticing how it shapes personal and community life and wanting to interrogate rather than accept it.","sub":"A.2","strand":"A","subName":"Investigative Curiosity and Agency","comp":7,"gb":[2,1,1,2,1]},{"code":"A.2.2","name":"Agency and Action with Data","desc":"Recognize data as a means for change and develop the disposition to use it to inform decisions and issues that matter.","sub":"A.2","strand":"A","subName":"Investigative Curiosity and Agency","comp":5,"gb":[1,1,1,1,1]},{"code":"A.3.1","name":"A Skeptical, Evidence-Seeking Stance","desc":"Develop the habit of asking whether a claim is actually supported by data, distinguishing evidence from opinion and resisting persuasive-but-unsupported assertions.","sub":"A.3","strand":"A","subName":"Reasoning About and Evaluating Claims","comp":6,"gb":[2,1,1,1,1]},{"code":"A.3.2","name":"Questioning What a Claim Really Shows","desc":"Develop the habit of asking what else could explain a pattern (correlation vs. causation), whether a finding rests on shaky ground (validation), and whether it extends beyond its context (generalization).","sub":"A.3","strand":"A","subName":"Reasoning About and Evaluating Claims","comp":10,"gb":[1,2,2,3,2]},{"code":"A.4.1","name":"The Phases of the Data Investigation Cycle","desc":"Name and understand the phases of a data investigation, recognizing that an investigation can begin either from a question or from exploring an existing dataset.","sub":"A.4","strand":"A","subName":"The Investigative Cycle: Questions, Data, and Iteration","comp":9,"gb":[1,2,2,2,2]},{"code":"A.4.2","name":"Forming Investigatable Questions","desc":"Formulate clear, empirical questions answerable with data, recognizing they evolve as findings emerge.","sub":"A.4","strand":"A","subName":"The Investigative Cycle: Questions, Data, and Iteration","comp":10,"gb":[2,2,2,2,2]},{"code":"A.4.3","name":"Iterating as Evidence Emerges","desc":"Treat investigation as cyclic: revise methods and conclusions as new data arrives, updating thinking rather than committing to first answers. Recognize that uncertainty is normal, and grow comfortable revising beliefs as evidence accumulates.","sub":"A.4","strand":"A","subName":"The Investigative Cycle: Questions, Data, and Iteration","comp":10,"gb":[2,2,2,2,2]},{"code":"B.1.1","name":"Defining What to Measure","desc":"Recognize that data is produced through deliberate decisions about what to observe and how to represent phenomena as variables. Those decisions determine what the data can and cannot say, and no analysis can recover information that was never captured.","sub":"B.1","strand":"B","subName":"Measurement","comp":11,"gb":[3,2,3,2,1]},{"code":"B.1.2","name":"Evaluating Measurement Quality","desc":"Evaluate the precision, validity, reliability, and potential bias of measurements when collecting your own data and when working with data collected by others, because measurement quality shapes what conclusions data can support.","sub":"B.1","strand":"B","subName":"Measurement","comp":5,"gb":[1,1,1,1,1]},{"code":"B.2.1","name":"Evaluating and Designing Sampling Procedures","desc":"Evaluate and design sampling procedures considering randomness, statistical bias, representativeness, sufficient size, and independence.","sub":"B.2","strand":"B","subName":"Sampling and Investigation Design","comp":15,"gb":[2,4,4,4,1]},{"code":"B.2.2","name":"Investigation Design","desc":"Understand how the structure of an investigation (including randomization, controls, and comparison groups) determines whether findings can support causal claims, because the difference between establishing cause and merely showing correlation almost always comes down to design.","sub":"B.2","strand":"B","subName":"Sampling and Investigation Design","comp":8,"gb":[1,2,2,2,1]},{"code":"B.2.3","name":"Gathering and Evaluating Secondary Data","desc":"Locate, retrieve, and evaluate data collected by others, assessing its trustworthiness, relevance, and origins.","sub":"B.2","strand":"B","subName":"Sampling and Investigation Design","comp":11,"gb":[1,2,3,3,2]},{"code":"B.3.1","name":"Privacy, Consent, and Representation","desc":"Apply ethical principles to who is included in data, how personal information is handled, and what consent requires, recognizing that data collection decisions affect real people and that historically these principles have often been violated.","sub":"B.3","strand":"B","subName":"Ethics in Data Collection/Production and Use","comp":9,"gb":[1,1,3,3,1]},{"code":"B.3.2","name":"Harm, Accountability, and the Societal Footprint of Data Systems","desc":"Recognize that data collection and data-driven technologies carry broader societal consequences, including environmental costs, labor impacts, and the potential for AI systems to perpetuate or amplify harm, and apply strategies to evaluate and mitigate those effects.","sub":"B.3","strand":"B","subName":"Ethics in Data Collection/Production and Use","comp":5,"gb":[0,1,1,2,1]},{"code":"B.4.1","name":"Organizing Data","desc":"Organize raw data into structured formats (e.g., tables, nested or hierarchical structures) using consistent conventions. A case is one observation; a variable is a recorded characteristic across cases.","sub":"B.4","strand":"B","subName":"Organizing and Processing of Data","comp":14,"gb":[3,4,3,2,2]},{"code":"B.4.2","name":"Data Cleaning","desc":"Identify and address data quality issues affecting accuracy and reliability, because missing values, errors, and inconsistencies distort any analysis built on top of them and real-world data almost never arrives clean.","sub":"B.4","strand":"B","subName":"Organizing and Processing of Data","comp":12,"gb":[2,3,4,1,2]},{"code":"B.4.3","name":"Processing Data","desc":"Transform data through various data moves (e.g., filtering, sorting, grouping, creating variables, merging, aggregating) and recognize that different moves shape what patterns become visible and what conclusions are possible.","sub":"B.4","strand":"B","subName":"Organizing and Processing of Data","comp":15,"gb":[1,4,4,4,2]},{"code":"C.1.1","name":"Recognizing Variation is Everywhere","desc":"Recognize that the world varies, that this variability is why data can't be read at a glance, and that data is how we begin to organize and make sense of the mess - and that living with this variation means getting comfortable reasoning under uncertainty rather than expecting one clean answer.","sub":"C.1","strand":"C","subName":"Exploring Data","comp":4,"gb":[1,1,1,1,0]},{"code":"C.1.2","name":"Exploring Data to Generate Questions","desc":"Explore a dataset with curiosity to see what it contains and what questions it raises as the entry point to describing and analyzing data.","sub":"C.1","strand":"C","subName":"Exploring Data","comp":7,"gb":[1,2,2,1,1]},{"code":"C.2.1","name":"Visualizing Single Variables","desc":"Create and interpret visualizations of single variable distributions (including categorical, numerical, and non-traditional data types) to identify where values cluster (a center or common value) and how much they vary (spread or noise).","sub":"C.2","strand":"C","subName":"Visualizing Data for Analysis","comp":11,"gb":[3,2,2,2,2]},{"code":"C.2.2","name":"Visualizing Relationships Among Variables","desc":"Create and interpret visualizations of two or more variables, including numerical, categorical, time-series, geospatial, and other data types, to identify patterns and assess whether they are consistent or merely scattered.","sub":"C.2","strand":"C","subName":"Visualizing Data for Analysis","comp":21,"gb":[2,4,5,5,5]},{"code":"C.3.1","name":"Summarizing Single Variables","desc":"Use suitable measures of center and spread to describe what is typical in a distribution and how much values vary, and compare that variation across groups or conditions, selecting measures based on data type and distribution shape.","sub":"C.3","strand":"C","subName":"Summarizing Data","comp":14,"gb":[3,3,4,2,2]},{"code":"C.3.2","name":"Summarizing Relationships Among Variables","desc":"Use summary measures to describe the strength and nature of relationships among variables, recognizing how aggregation choices and subgroup differences can obscure or reveal patterns.","sub":"C.3","strand":"C","subName":"Summarizing Data","comp":26,"gb":[2,5,6,6,7]},{"code":"C.4.1","name":"Sources of Variability","desc":"Identify and distinguish among natural, measurement, sampling, and designed variability as distinct sources of spread, and judge whether an unusual value reflects a genuine signal or an error, distinguishing these sources when interpreting data you already have.","sub":"C.4","strand":"C","subName":"Interpreting Variability","comp":8,"gb":[1,2,2,2,1]},{"code":"C.4.2","name":"Signal, Noise, and Reasoning Beyond the Data","desc":"Make sense of why data varies and use that variation to judge whether an observed pattern is likely real or due to chance, which answers the question underlying virtually every evidence-based argument.","sub":"C.4","strand":"C","subName":"Interpreting Variability","comp":6,"gb":[0,2,2,1,1]},{"code":"D.1.1","name":"Understanding and Selecting Models","desc":"Understand modeling as representing a relationship, process, or pattern in the world in order to reason or extrapolate beyond the data in hand, not just to summarize data you already have. Recognize that there are different kinds of models (classification, regression, and generative among them) and choose the kind that fits the investigation's goal and the structure of the data.","sub":"D.1","strand":"D","subName":"Building and Selecting Models","comp":10,"gb":[3,1,3,2,1]},{"code":"D.1.2","name":"Building Models for Outcomes","desc":"Build models of three kinds: classification models that assign a case to a category, regression models that predict a numeric value, and generative models that learn a pattern from examples to produce new cases using statistical, algorithmic, and computational tools, treating a model as a representation that can be built, run, and refined.","sub":"D.1","strand":"D","subName":"Building and Selecting Models","comp":15,"gb":[3,3,3,3,3]},{"code":"D.1.3","name":"Representing Uncertainty with Probability","desc":"Use probability to express the uncertainty a model or claim carries (so predictions come with a stated degree of confidence rather than as certainties) and recognize that those confidence levels update as new data arrives: prior beliefs inform how we interpret new evidence, and new evidence revises those beliefs.","sub":"D.1","strand":"D","subName":"Building and Selecting Models","comp":11,"gb":[1,2,3,3,2]},{"code":"D.2.1","name":"Predicting New Cases","desc":"Use a model to predict outcomes for cases not in the data, and quantify how much uncertainty surrounds each prediction.","sub":"D.2","strand":"D","subName":"Using Models to Predict and Explain","comp":9,"gb":[0,2,2,3,2]},{"code":"D.2.2","name":"Reasoning Beyond the Data","desc":"Apply models to make predictions about cases not yet seen and reason about what data implies for a broader population, building the habit of always asking 'does this generalize, and how far?' which is one of the most transferable critical-thinking skills in data science.","sub":"D.2","strand":"D","subName":"Using Models to Predict and Explain","comp":6,"gb":[1,1,1,1,2]},{"code":"D.3.1","name":"Quantifying Error and Comparing Models","desc":"Measure how well a model fits and predicts using error, and compare competing models to judge which better serves the goal.","sub":"D.3","strand":"D","subName":"Evaluating and Improving Models","comp":13,"gb":[1,2,2,3,5]},{"code":"D.3.2","name":"Weighing Evidence and Causal Claims","desc":"Judge how strong and how far-reaching the evidence for a claim is, including whether a study's design (observational or experimental, randomized) supports a causal conclusion or only an association.","sub":"D.3","strand":"D","subName":"Evaluating and Improving Models","comp":4,"gb":[0,0,2,1,1]},{"code":"D.3.3","name":"Refining and Updating Models","desc":"Revise a model and its predictions as new data and evidence arrive, treating modeling as an intentional, iterative back-and-forth rather than a one-time build.","sub":"D.3","strand":"D","subName":"Evaluating and Improving Models","comp":6,"gb":[0,1,2,2,1]},{"code":"E.1.1","name":"Interpreting Results in Context","desc":"Translate the outputs of analyses and models into contextual meaning that supports or qualifies a claim, making sense of what a result actually says about the real world in plain language.","sub":"E.1","strand":"E","subName":"Making and Justifying Claims with Data","comp":8,"gb":[1,2,2,2,1]},{"code":"E.1.2","name":"Characterizing Significance and Implications","desc":"Characterize both the statistical significance (where appropriate) and the practical significance of a finding, stating its limitations and broader implications.","sub":"E.1","strand":"E","subName":"Making and Justifying Claims with Data","comp":10,"gb":[1,3,2,2,2]},{"code":"E.1.3","name":"Evaluating Claims and Evidence","desc":"Evaluate analyses and claims (your own and others') to determine what the evidence actually supports, distinguishing justified conclusions from overstatements and ensuring limitations are named.","sub":"E.1","strand":"E","subName":"Making and Justifying Claims with Data","comp":7,"gb":[1,1,2,1,2]},{"code":"E.2.1","name":"Communicating with Completeness and Accuracy","desc":"Communicate findings so that the reasoning behind them such as the evidence used, the choices made, and the uncertainty remaining is visible and checkable by others.","sub":"E.2","strand":"E","subName":"Communicating Responsibly and Effectively","comp":11,"gb":[2,2,2,3,2]},{"code":"E.2.2","name":"Communicating for Audience and Purpose with Narrative and Visualization Design","desc":"Make deliberate choices about how to present data like through storytelling, narrative structure, and visualization design, tailored to the audience's needs, background, and goals, because knowing your audience and making intentional design decisions are both required; neither alone is sufficient.","sub":"E.2","strand":"E","subName":"Communicating Responsibly and Effectively","comp":13,"gb":[2,2,4,2,3]},{"code":"E.2.3","name":"Justifying and Communicating Analytical Decisions","desc":"Provide a clear, reasoned account of the decisions made throughout a data investigation, such as what was collected, cleaned or excluded, and which tools and methods were chosen because transparency about analytical choices is both an ethical obligation and the foundation of trustworthy, reproducible work.","sub":"E.2","strand":"E","subName":"Communicating Responsibly and Effectively","comp":7,"gb":[1,1,1,2,2]},{"code":"E.2.4","name":"Reading and Critically Evaluating Data Communication","desc":"Read data visualizations and verbal data claims accurately, from common graphs to complex, multivariable, and nonstandard displays, and evaluate them critically, identifying what is emphasized or hidden, whether design choice e other cannot.","change":"Revised","from":["3-5.A.1.1a"],"why":""},{"id":"11-12.A.1.1a","band":"11-12","concept":"A.1.1","text":"Design a data investigation that deliberately uses at least two incompatible data types, defend why both are necessary, and evaluate the cost and limitations of converting each to analyzable form.","change":"Revised","from":["9-10.A.1.1b"],"why":""},{"id":"K-2.A.1.2a","band":"K-2","concept":"A.1.2","text":"Give an example of information about a person that could be collected, but should stay private and explain why.","change":"Revised","from":["K-2.A.2.1a"],"why":""},{"id":"3-5.A.1.2a","band":"3-5","concept":"A.1.2","text":"Recognize that people have rights about data collected about them, and that those rights can include seeing or questioning what was recorded.","change":"Revised","from":["3-5.A.2.3a"],"why":""},{"id":"3-5.A.1.2b","band":"3-5","concept":"A.1.2","text":"Describe how the choices about what data to collect, and who to collect it from, can make a result unfair to some people.","change":"Revised","from":["A.2.2","A.1.2"],"why":"Unfairness arising from who is included in collection is V1 bias in data, produced by human collection choices."},{"id":"3-5.A.1.2c","band":"3-5","concept":"A.1.2","text":"Give an example of how a dataset can help a group of people and an example of how the same dataset could hurt someone in it.","change":"Revised","from":["3-5.A.2.2b"],"why":""},{"id":"6-8.A.1.2a","band":"6-8","concept":"A.1.2","text":"Give examples of data being used to solve a problem, to persuade, and to discover something new, and explain the difference between these three uses.","change":"Revised","from":["3-5.A.2.1b"],"why":""},{"id":"6-8.A.1.2b","band":"6-8","concept":"A.1.2","text":"Locate and use the privacy settings or data-request options in an app or website you use, and explain what rights you are exercising.","change":"Revised","from":["6-8.A.2.3a"],"why":""},{"id":"6-8.A.1.2c","band":"6-8","concept":"A.1.2","text":"Explain that data is shaped by human choices (what to collect, what to leave out, how to collect it, how to interpret it) and that those choices have consequences.","change":"Revised","from":["A.1.2"],"why":"Direct restatement of V1 \"Data are produced by people\"."},{"id":"6-8.A.1.2d","band":"6-8","concept":"A.1.2","text":"Weigh a specific dataset's benefits to a community against its potential risks to the individuals in it.","change":"Unchanged","from":["3-5.A.1.2b","6-8.A.2.1b"],"why":""},{"id":"9-10.A.1.2a","band":"9-10","concept":"A.1.2","text":"Evaluate how data drives innovation and informs choices (e.g., individual, family, community, industry, societal).","change":"Revised","from":["6-8.A.2.1b"],"why":""},{"id":"9-10.A.1.2b","band":"9-10","concept":"A.1.2","text":"Evaluate how privacy rights are upheld or violated in specific real-world data practices (e.g., terms of service agreements, location tracking by apps, student data collected by schools).","change":"Revised","from":["9-10.A.2.3a"],"why":""},{"id":"9-10.A.1.2c","band":"9-10","concept":"A.1.2","text":"Evaluate a real data-collection policy (e.g., a school's use of student data, a city's use of surveillance cameras) by weighing documented benefits against documented risks, and take a position.","change":"Revised","from":["9-10.A.2.2b"],"why":""},{"id":"11-12.A.1.2a","band":"11-12","concept":"A.1.2","text":"Evaluate and critique instances where data contributed to scientific, economic, or social change.","change":"Unchanged","from":["9-10.A.2.1b"],"why":""},{"id":"11-12.A.1.2b","band":"11-12","concept":"A.1.2","text":"Compare how data ownership, access, and control differ across settings (e.g., social media, healthcare, education, government) and across groups of people.","change":"Revised","from":["11-12.A.2.3b"],"why":""},{"id":"11-12.A.1.2c","band":"11-12","concept":"A.1.2","text":"Distinguish between algorithmic bias that was built in deliberately and bias that emerged unintentionally from training data, and give an example of each.","change":"Revised","from":["A.2.2","A.1.5"],"why":"Deliberate vs. emergent algorithmic bias joins V1 bias in data to V1 data and AI."},{"id":"K-2.A.1.3a","band":"K-2","concept":"A.1.3","text":"Recognize that some tools (like a voice assistant) use information people give them to work.","change":"Revised","from":["A.1.5"],"why":"Tools using information people give them is the K-2 entry point of V1 data and AI."},{"id":"3-5.A.1.3a","band":"3-5","concept":"A.1.3","text":"Recognize that some computer tools get better at a task by seeing many examples (e.g., a phone keyboard that learns which word you usually type next).","change":"Revised","from":["K-2.A.1.5a","K-2.A.1.5b"],"why":""},{"id":"3-5.A.1.3b","band":"3-5","concept":"A.1.3","text":"Recognize that computers need data organized in a consistent way (like a table) to use it.","change":"Revised","from":["3-5.A.1.5a"],"why":""},{"id":"6-8.A.1.3a","band":"6-8","concept":"A.1.3","text":"Describe in plain language how an AI model learns patterns from many examples and uses them to make predictions or generate new outputs.","change":"Revised","from":["3-5.A.1.5b"],"why":""},{"id":"6-8.A.1.3b","band":"6-8","concept":"A.1.3","text":"Predict how problems in training data (missing groups, errors, skewed examples) would show up in an AI tool's outputs, and give a specific example.","change":"Revised","from":["A.1.5","C.3.4"],"why":"Training-data problems surfacing in outputs is V1 variability in our computational world applied to AI."},{"id":"6-8.A.1.3c","band":"6-8","concept":"A.1.3","text":"Recognize that an AI system only knows what it was trained on; it does not contain all knowledge.","change":"Revised","from":["6-8.A.1.5b"],"why":""},{"id":"9-10.A.1.3a","band":"9-10","concept":"A.1.3","text":"Describe the basic structure of a predictive model in terms of inputs, outputs, and a relationship estimated from data.","change":"Unchanged","from":["A.1.5"],"why":"Inputs, outputs, and an estimated relationship restates V1 A.1.5 model structure."},{"id":"9-10.A.1.3b","band":"9-10","concept":"A.1.3","text":"Explain how data in varied formats (e.g., images, audio, text) can be translated into numerical form that a computer program can process.","change":"Revised","from":["9-10.A.1.5a"],"why":""},{"id":"9-10.A.1.3c","band":"9-10","concept":"A.1.3","text":"Explain how patterns in training data lead to algorithmic biases by affecting which predictors the model uses and how much weight it gives them.","change":"Revised","from":["9-10.A.1.5b"],"why":""},{"id":"9-10.A.1.3d","band":"9-10","concept":"A.1.3","text":"Explain that AI training data overrepresents some sources (e.g., English-language, digitized, recent text) and omits most human knowledge, experience, and languages, including whose knowledge it systematically leaves out, so what AI 'knows' is a narrow, skewed slice of reality.","change":"Revised","from":["9-10.A.1.5c"],"why":""},{"id":"11-12.A.1.3a","band":"11-12","concept":"A.1.3","text":"Outline the basic parts of a simple prediction algorithm and explain how it measures its error and adjusts predictions to reduce it (sometimes called a loss or cost function).","change":"Revised","from":["A.1.5"],"why":"Error measurement and adjustment matches V1 A.1.5 cost-function competency."},{"id":"11-12.A.1.3b","band":"11-12","concept":"A.1.3","text":"Justify whether a given problem is well suited to an AI or machine-learning approach, a simpler statistical model, or no model at all, using criteria such as data availability, interpretability, and the cost of errors.","change":"Revised","from":["11-12.A.1.5a","11-12.A.1.5b"],"why":""},{"id":"11-12.A.1.3c","band":"11-12","concept":"A.1.3","text":"Evaluate an AI-generated output by comparing it against an independent source of ground truth, and explain where the AI's training-data limitations produced errors or gaps.","change":"Revised","from":["11-12.A.1.5c","11-12.A.1.5d"],"why":""},{"id":"K-2.A.2.1a","band":"K-2","concept":"A.2.1","text":"Notice when data is being collected or used in everyday situations.","change":"Unchanged","from":["A.3.5"],"why":"Noticing data in everyday life is the K-2 form of V1 student data agency."},{"id":"K-2.A.2.1b","band":"K-2","concept":"A.2.1","text":"Show curiosity about data and how it is used in the world, exploring open-ended questions.","change":"Unchanged","from":["K-2.A.1.2a"],"why":""},{"id":"3-5.A.2.1a","band":"3-5","concept":"A.2.1","text":"Describe ways that data encountered in daily life shapes decisions and habits.","change":"Unchanged","from":["K-2.A.3.5a","K-2.A.3.5b"],"why":""},{"id":"6-8.A.2.1a","band":"6-8","concept":"A.2.1","text":"Examine the accuracy, credibility, and relevance of data sources used to answer questions of personal or community interest.","change":"Unchanged","from":["3-5.A.3.5a"],"why":""},{"id":"9-10.A.2.1a","band":"9-10","concept":"A.2.1","text":"Choose a question of personal or community interest and plan how data could be used to investigate it, identifying what type of data is needed and how it could be obtained.","change":"Revised","from":["6-8.A.3.5b"],"why":""},{"id":"9-10.A.2.1b","band":"9-10","concept":"A.2.1","text":"Distinguish whether a source is accurate and credible (can it be verified?) from whether it is trusted (who believes it and why), and give an example where the two differ.","change":"Revised","from":["9-10.A.3.5a"],"why":""},{"id":"11-12.A.2.1a","band":"11-12","concept":"A.2.1","text":"Carry out a data investigation on a question of personal or community significance.","change":"Revised","from":["A.3.5","E.3.3"],"why":"A self-directed investigation on a community question joins data agency to civic data practices."},{"id":"K-2.A.2.2a","band":"K-2","concept":"A.2.2","text":"Recognize that data can help you make a case or improve a guess.","change":"Unchanged","from":["A.2.3"],"why":"Data improving a guess or making a case is V1 power of data at K-2."},{"id":"3-5.A.2.2a","band":"3-5","concept":"A.2.2","text":"Use data you collected to support an argument about a question that matters to your class or school.","change":"Revised","from":["K-2.A.2.3a","K-2.A.3.5a"],"why":""},{"id":"6-8.A.2.2a","band":"6-8","concept":"A.2.2","text":"Use a provided dataset to make a recommendation about a school or community issue, and explain what the data does and does not support.","change":"Revised","from":["3-5.A.2.3a"],"why":""},{"id":"9-10.A.2.2a","band":"9-10","concept":"A.2.2","text":"Choose your own dataset and question on a collective issue, use it to take a position, and explain the limitations of your data.","change":"Revised","from":["6-8.A.3.5a"],"why":""},{"id":"11-12.A.2.2a","band":"11-12","concept":"A.2.2","text":"Synthesize insights from data to take informed action or advocate on an issue of community significance, and defend your data choices to an informed audience.","change":"Revised","from":["9-10.A.3.5a"],"why":""},{"id":"K-2.A.3.1a","band":"K-2","concept":"A.3.1","text":"Ask 'how do we know?' and similar questions to notice the difference between a guess and something shown by data.","change":"Unchanged","from":["A.1.4","A.2.3"],"why":"Distinguishing a guess from something data shows draws on partial information and power of data."},{"id":"K-2.A.3.1b","band":"K-2","concept":"A.3.1","text":"Give an example of a question our data can answer and one it cannot.","change":"Revised","from":["A.1.4","D.2.1"],"why":"What data can and cannot answer is partial information plus verifiable questions."},{"id":"3-5.A.3.1a","band":"3-5","concept":"A.3.1","text":"Distinguish an argument backed by data from one that is not.","change":"Unchanged","from":["K-2.A.1.4a"],"why":""},{"id":"6-8.A.3.1a","band":"6-8","concept":"A.3.1","text":"Specify what evidence would be needed to support a claim, including what study design or data would be required, and resist persuasive-but-unsupported assertions.","change":"Revised","from":["6-8.A.1.4b","6-8.A.3.5b"],"why":""},{"id":"9-10.A.3.1a","band":"9-10","concept":"A.3.1","text":"Separate evidence from opinion in media and civic claims, and identify the specific data or study design that would be needed to support each.","change":"Revised","from":["6-8.A.1.4b"],"why":""},{"id":"11-12.A.3.1a","band":"11-12","concept":"A.3.1","text":"Determine when data alone is insufficient and specify what complementary methods (e.g., qualitative interviews, controlled experiments) would strengthen the argument.","change":"Revised","from":["A.2.3"],"why":"Matches V1 11-12.A.2.3c on when data alone is insufficient and complementary methods are needed."},{"id":"K-2.A.3.2a","band":"K-2","concept":"A.3.2","text":"Explore whether something that is true for one group is true for another.","change":"Unchanged","from":["11-12.A.2.3c"],"why":""},{"id":"3-5.A.3.2a","band":"3-5","concept":"A.3.2","text":"Ask whether a finding about one set of people or things would also be true for a different set, and describe what makes you think it would or would not.","change":"Revised","from":["D.3.1"],"why":"Whether a finding holds for a different group is V1 application fitness."},{"id":"3-5.A.3.2b","band":"3-5","concept":"A.3.2","text":"Ask whether one thing really causes another or just happens alongside it.","change":"Unchanged","from":["D.1.6"],"why":"Cause versus co-occurrence is V1 correlation versus causation."},{"id":"6-8.A.3.2a","band":"6-8","concept":"A.3.2","text":"Explain how selecting a sample at random reduces systematic skew, and evaluate whether a sample is large or representative enough to trust a claim made from it.","change":"Revised","from":["D.1.7","D.3.3"],"why":"Random selection reducing skew plus judging sufficient size joins randomization and sample size."},{"id":"6-8.A.3.2b","band":"6-8","concept":"A.3.2","text":"Explain what else could explain a pattern (a third factor or more) before accepting a cause-and-effect claim.","change":"Revised","from":["3-5.D.1.6a"],"why":""},{"id":"9-10.A.3.2a","band":"9-10","concept":"A.3.2","text":"Ask whether a finding rests on shaky ground (small or unrepresentative sample, weak measure) and thus would not generalize, specifying what would need to change for the finding to hold more broadly.","change":"Revised","from":["D.3.1","D.3.4"],"why":"Shaky ground from small or unrepresentative samples joins application fitness to simple bias."},{"id":"9-10.A.3.2b","band":"9-10","concept":"A.3.2","text":"Distinguish whether a claimed cause could instead be explained by a confounding variable or by reverse causation, and describe how you would test each alternative.","change":"Revised","from":["6-8.D.1.6a"],"why":""},{"id":"9-10.A.3.2c","band":"9-10","concept":"A.3.2","text":"Examine a data-based claim in media and identify whether it over-extends the data (e.g., drawing conclusions from a sample too small or too unrepresentative to support them) describing specifically what the data does and does not show.","change":"Revised","from":["9-10.D.3.1a"],"why":""},{"id":"11-12.A.3.2a","band":"11-12","concept":"A.3.2","text":"Evaluate competing data-based claims by judging how far each is justified beyond its original sample, setting, or time. Determine which claim is better supported when they conflict.","change":"","from":["9-10.A.3.4b"],"why":""},{"id":"11-12.A.3.2b","band":"11-12","concept":"A.3.2","text":"Interrogate a claim for confounding, validity threats, and over-generalization, and specify what additional evidence or study design would be needed to strengthen or refute it.","change":"Unchanged","from":["D.3.1","D.1.6"],"why":"Confounding, validity threats, and over-generalization span application fitness and causation."},{"id":"K-2.A.4.1a","band":"K-2","concept":"A.4.1","text":"Recognize that exploring a question with data follows a process that is not necessarily linear: asking, getting or collecting data, examining it, and sharing what you found.","change":"Revised","from":["A.3.1","A.3.2"],"why":"A non-linear process combines V1 investigative process and iteration."},{"id":"3-5.A.4.1a","band":"3-5","concept":"A.4.1","text":"Name the main phases of a data investigation (ask, collect data, examine and analyze, interpret and communicate) and describe what each phase accomplishes, recognizing you can revisit earlier phases.","change":"Revised","from":["A.3.1"],"why":"Naming the phases restates V1 the investigative process."},{"id":"3-5.A.4.1b","band":"3-5","concept":"A.4.1","text":"Recognize that different computer-based tools are suited to different data tasks (organizing, visualizing, calculating) and identify which type of tool fits a given task.","change":"Unchanged","from":["K-2.A.3.1a"],"why":""},{"id":"6-8.A.4.1a","band":"6-8","concept":"A.4.1","text":"Start an investigation from an existing dataset rather than a question, and explain how that changes the first phase of the investigation cycle","change":"Revised","from":["3-5.A.3.1a"],"why":""},{"id":"6-8.A.4.1b","band":"6-8","concept":"A.4.1","text":"Explain why the choice of computer-based tool affects how a data task is carried out.","change":"Revised","from":["C.4.4"],"why":"Tool choice shaping how a task is carried out is V1 tool selection."},{"id":"9-10.A.4.1a","band":"9-10","concept":"A.4.1","text":"Explain how the phases of a data investigation inform one another (for example, how the wording of a survey question limits which visualizations make sense later) and how decisions in one phase constrain other phases.","change":"Revised","from":["6-8.A.3.1a"],"why":""},{"id":"9-10.A.4.1b","band":"9-10","concept":"A.4.1","text":"Select computer-based tools appropriate to the scale, complexity, and purpose of a data task, and explain what each tool can and cannot do well, recognizing that tool choice shapes what analysis is possible.","change":"Revised","from":["C.4.4","C.4.3"],"why":"Matching tool to scale and purpose, with limits, joins tool selection and tool evaluation."},{"id":"11-12.A.4.1a","band":"11-12","concept":"A.4.1","text":"Evaluate a data investigation by examining how well each phase was carried out and where iteration improved, or should have improved, the work.","change":"Revised","from":["9-10.A.3.1a"],"why":""},{"id":"11-12.A.4.1b","band":"11-12","concept":"A.4.1","text":"Evaluate computer-based tools for a data investigation by weighing their capabilities, limitations, and appropriateness to the task.","change":"Revised","from":["C.4.3","C.4.4"],"why":"Weighing tool capabilities and limitations is V1 tool evaluation with selection."},{"id":"K-2.A.4.2a","band":"K-2","concept":"A.4.2","text":"Notice when answering one question leads to asking another.","change":"Unchanged","from":["A.3.2"],"why":"One question leading to another is V1 iteration at K-2."},{"id":"K-2.A.4.2b","band":"K-2","concept":"A.4.2","text":"Ask simple questions about familiar contexts that can be answered by counting or measuring.","change":"Unchanged","from":["D.2.1","B.2.1"],"why":"Questions answerable by counting or measuring is V1 verifiable questions, via investigation design."},{"id":"3-5.A.4.2a","band":"3-5","concept":"A.4.2","text":"Show how findings from a data investigation often raise new questions worth investigating.","change":"Unchanged","from":["K-2.A.3.2a"],"why":""},{"id":"3-5.A.4.2b","band":"3-5","concept":"A.4.2","text":"Identify what kinds of questions real-world data can answer, and describe what data would need to be collected to answer the question.","change":"Revised","from":["K-2.B.2.1a"],"why":""},{"id":"6-8.A.4.2a","band":"6-8","concept":"A.4.2","text":"Revise investigation questions based on what data reveals, recognizing mid-investigation questions as normal and productive.","change":"Unchanged","from":["3-5.A.3.2a"],"why":""},{"id":"6-8.A.4.2b","band":"6-8","concept":"A.4.2","text":"Develop data-based questions that explore relationships between variables.","change":"Unchanged","from":["3-5.B.2.1a"],"why":""},{"id":"9-10.A.4.2a","band":"9-10","concept":"A.4.2","text":"Document how questions evolved during an investigation and articulate what new questions emerged.","change":"Unchanged","from":["6-8.A.3.2a"],"why":""},{"id":"9-10.A.4.2b","band":"9-10","concept":"A.4.2","text":"Refine a question to specify whether it calls for estimating a value (e.g., what is the typical commute time?) or testing a relationship (e.g., do commute times differ by neighborhood?), and explain how that choice shapes the investigation.","change":"","from":["6-8.B.2.1a"],"why":""},{"id":"11-12.A.4.2a","band":"11-12","concept":"A.4.2","text":"Design investigations with explicit moments to revisit and revise questions in light of emerging data, treating iteration as a methodological choice.","change":"Unchanged","from":["9-10.A.3.2a"],"why":""},{"id":"11-12.A.4.2b","band":"11-12","concept":"A.4.2","text":"Design research questions that involve several variables and specify which relationships among them are of interest and why.","change":"Revised","from":["9-10.B.2.1a","9-10.B.2.1b"],"why":""},{"id":"K-2.A.4.3a","band":"K-2","concept":"A.4.3","text":"Recognize that finding out new information provides the opportunity to look again at a question, ask a new question, or try to find another way to answer it.","change":"Revised","from":["11-12.B.2.1b"],"why":""},{"id":"K-2.A.4.3b","band":"K-2","concept":"A.4.3","text":"Make a guess before looking through information and use the information to decide if that guess was supported or needs to change.","change":"Revised","from":["D.1.2"],"why":"Guess first, then revise against evidence, is V1 priors and updates at K-2."},{"id":"3-5.A.4.3a","band":"3-5","concept":"A.4.3","text":"Revise methods and inferences as new findings emerge during an investigation.","change":"Revised","from":["K-2.A.3.2a"],"why":""},{"id":"3-5.A.4.3b","band":"3-5","concept":"A.4.3","text":"Make a prediction about what you expect to find before investigating, and compare it to what the data shows.","change":"Unchanged","from":["K-2.A.3.2a"],"why":""},{"id":"6-8.A.4.3a","band":"6-8","concept":"A.4.3","text":"Explain how the investigative process is non-linear, revising conclusions and using evidence as new data emerges.","change":"Unchanged","from":["3-5.A.3.2a"],"why":""},{"id":"6-8.A.4.3b","band":"6-8","concept":"A.4.3","text":"Treat a first conclusion as a starting point to be updated as new data arrives, and explain why revising a conclusion is a sign of good reasoning, not a sign of being wrong.","change":"Revised","from":["A.3.3","D.2.2"],"why":"Treating a first conclusion as provisional joins dynamic inferences to iteration and validation."},{"id":"9-10.A.4.3a","band":"9-10","concept":"A.4.3","text":"Revise an analysis after a first pass (e.g., add a new variable, examine a subset, try a different visualization) and document what changed and what you learned from the revision.","change":"Revised","from":["6-8.A.3.2a"],"why":""},{"id":"9-10.A.4.3b","band":"9-10","concept":"A.4.3","text":"Update a prediction or conclusion when new evidence arrives, describing what changed and why (priors and updates).","change":"Unchanged","from":["K-2.A.3.3a"],"why":""},{"id":"11-12.A.4.3a","band":"11-12","concept":"A.4.3","text":"Design and refine investigative approaches to deepen insights and strengthen arguments.","change":"Unchanged","from":["9-10.A.3.2a"],"why":""},{"id":"11-12.A.4.3b","band":"11-12","concept":"A.4.3","text":"Treat investigation as iteratively updating prior conclusions with new evidence, articulating how an understanding's strength shifts as data accumulates (priors and updates).","change":"Unchanged","from":["9-10.A.3.3a"],"why":""},{"id":"K-2.B.1.1a","band":"K-2","concept":"B.1.1","text":"Ask how a set of data was collected (who counted, who measured, when).","change":"Revised","from":["B.3.2","A.1.2"],"why":"Asking who counted and when is V1 working with data created by others."},{"id":"K-2.B.1.1b","band":"K-2","concept":"B.1.1","text":"Measure something using consistent units.","change":"Unchanged","from":["B.3.1"],"why":"Measuring with consistent units matches V1 K-2.B.3.1b on standard units."},{"id":"K-2.B.1.1c","band":"K-2","concept":"B.1.1","text":"Record more than one attribute about the same person or object, creating a simple 'case.'","change":"Unchanged","from":["K-2.A.1.2a"],"why":""},{"id":"3-5.B.1.1a","band":"3-5","concept":"B.1.1","text":"Describe the choices someone made about what and how to measure in a dataset you are using.","change":"Revised","from":["K-2.B.3.1b"],"why":""},{"id":"3-5.B.1.1b","band":"3-5","concept":"B.1.1","text":"Identify characteristics that can be measured and describe the procedures and instruments used to measure them.","change":"Revised","from":["K-2.B.3.1c"],"why":""},{"id":"6-8.B.1.1a","band":"6-8","concept":"B.1.1","text":"Identify who collected a dataset, when, where, and for what purpose, and explain how that purpose shaped what was collected.","change":"Revised","from":["3-5.A.1.2b"],"why":""},{"id":"6-8.B.1.1b","band":"6-8","concept":"B.1.1","text":"Use data from a classroom sensor or provided simulation to answer a question.","change":"Revised","from":["3-5.B.3.1c"],"why":""},{"id":"6-8.B.1.1c","band":"6-8","concept":"B.1.1","text":"Turn a set of images, text, or audio clips into a data table by deciding what to count or measure about each one (e.g., word counts, dominant color, length).","change":"Added","from":["6-8.B.3.2b","6-8.B.3.2c"],"why":""},{"id":"9-10.B.1.1a","band":"9-10","concept":"B.1.1","text":"Design and implement automated data collection (e.g., deploying sensors, specifying what to log, how often, and for how long) to investigate a question.","change":"Revised","from":["3-5.B.2.2b","6-8.B.2.2b"],"why":""},{"id":"9-10.B.1.1b","band":"9-10","concept":"B.1.1","text":"Investigate how an existing dataset was measured or produced, and explain how those methods affect what the data can and cannot show.","change":"Revised","from":["B.3.2"],"why":"Investigating how an existing dataset was produced is V1 working with others\u2019 data."},{"id":"11-12.B.1.1a","band":"11-12","concept":"B.1.1","text":"Evaluate whether an existing dataset's measurement decisions make it fit for a new purpose different from the one it was originally collected for.","change":"Revised","from":["11-12.B.2.2c"],"why":""},{"id":"K-2.B.1.2a","band":"K-2","concept":"B.1.2","text":"Recognize that data will differ because people have different opinions, objects are different colors, and that repeated measurements of the same thing may also differ.","change":"Revised","from":["A.1.3","B.3.1"],"why":"Repeated measurements differing joins V1 variability of data to anticipating measurement variability."},{"id":"3-5.B.1.2a","band":"3-5","concept":"B.1.2","text":"Take repeated measurements of the same thing and describe how they differ.","change":"Revised","from":["K-2.B.3.1a"],"why":""},{"id":"6-8.B.1.2a","band":"6-8","concept":"B.1.2","text":"Recognize why repeated measurements may differ, and record all of them without discarding values.","change":"Revised","from":["3-5.B.3.1b"],"why":""},{"id":"9-10.B.1.2a","band":"9-10","concept":"B.1.2","text":"Assess whether a measurement actually measures what it is intended to measure (validity), and identify examples where a measurement is consistent (reliable) but still off-target.","change":"Revised","from":["3-5.B.3.1b"],"why":""},{"id":"11-12.B.1.2a","band":"11-12","concept":"B.1.2","text":"Anticipate and address sources of measurement error, bias, and validity threats in a data-collection design, and explain the effect of each on the conclusions the data can support.","change":"Revised","from":["B.3.1","C.3.3"],"why":"Anticipating measurement error and validity threats joins creating your own data to sources of variability."},{"id":"K-2.B.2.1a","band":"K-2","concept":"B.2.1","text":"Identify what information is needed and where it might be found to answer simple questions.","change":"Unchanged","from":["B.2.3"],"why":"Matches V1 K-2.B.2.3a on identifying what information is needed and where to find it."},{"id":"K-2.B.2.1b","band":"K-2","concept":"B.2.1","text":"Identify what types of data are needed to answer a given question (e.g., numbers, images, surveys, counts, etc).","change":"Added","from":["B.2.3","D.2.4"],"why":"Identifying which data types answer a question joins collection planning to relevant conclusions."},{"id":"3-5.B.2.1a","band":"3-5","concept":"B.2.1","text":"Recognize that a sample may or may not reflect the entire group.","change":"Unchanged","from":["K-2.B.2.3a"],"why":""},{"id":"3-5.B.2.1b","band":"3-5","concept":"B.2.1","text":"Develop a basic data collection plan specifying what data to gather, what sources to access, and what tools to use.","change":"Unchanged","from":["3-5.D.1.5a"],"why":""},{"id":"3-5.B.2.1c","band":"3-5","concept":"B.2.1","text":"Recognize that who is included when data is collected, and why it was collected, can make a sample fair or unfair for a question.","change":"Unchanged","from":["3-5.B.2.3a"],"why":""},{"id":"3-5.B.2.1d","band":"3-5","concept":"B.2.1","text":"Propose types of data and comparisons relevant for answering a question, and identify data that is NOT relevant.","change":"Added","from":["D.2.4"],"why":"Matches V1 3-5.D.2.4a and 3-5.D.2.4b on relevant and non-relevant data for a question."},{"id":"6-8.B.2.1a","band":"6-8","concept":"B.2.1","text":"Explain how selecting a sample at random reduces systematic skew, and recognize that a sample may still be biased by collection methods or other factors.","change":"Revised","from":["6-8.B.3.3a"],"why":""},{"id":"6-8.B.2.1b","band":"6-8","concept":"B.2.1","text":"Develop a data collection plan that specifies variables, sources, and methods, and anticipates practical problems (missing responses, hard-to-reach groups).","change":"Unchanged","from":["6-8.D.3.4a"],"why":""},{"id":"6-8.B.2.1c","band":"6-8","concept":"B.2.1","text":"Explain how the choice of sampling method is itself a design decision that affects what conclusions can be drawn.","change":"Unchanged","from":["6-8.B.2.3a"],"why":""},{"id":"6-8.B.2.1d","band":"6-8","concept":"B.2.1","text":"Assess how sample size affects the accuracy of estimates and make informal arguments for whether a sample is large enough to represent a population.","change":"Unchanged","from":["6-8.D.1.5a"],"why":""},{"id":"9-10.B.2.1a","band":"9-10","concept":"B.2.1","text":"Compare common sampling approaches (random, convenience, stratified), where bias might be introduced in them, and judge which fits a question and why.","change":"Revised","from":["9-10.D.3.4b"],"why":""},{"id":"9-10.B.2.1b","band":"9-10","concept":"B.2.1","text":"Design a collection plan that chooses a sampling method to reduce likely bias, and explain how the method helps.","change":"Revised","from":["B.2.3","D.3.4"],"why":"A collection plan chosen to reduce bias joins collection planning to simple bias."},{"id":"9-10.B.2.1c","band":"9-10","concept":"B.2.1","text":"Recognize that combining data from different sources can distort results if the sources measured or sampled differently.","change":"Revised","from":["9-10.B.2.3a"],"why":""},{"id":"9-10.B.2.1d","band":"9-10","concept":"B.2.1","text":"Distinguish when data describes an entire population (a census or complete administrative record) from when it is a sample, and explain what that means for whether generalization is needed.","change":"Revised","from":["D.3.2"],"why":"Census versus sample is V1 sample versus population."},{"id":"11-12.B.2.1a","band":"11-12","concept":"B.2.1","text":"Design data collection plans that address potential biases and include quality-control protocols (e.g., pilot testing, double-entry checks).","change":"Revised","from":["9-10.D.3.2a"],"why":""},{"id":"K-2.B.2.2a","band":"K-2","concept":"B.2.2","text":"Recognize that sometimes we can test an idea with an experiment and sometimes we can only watch and record what happens.","change":"Unchanged","from":["B.2.2"],"why":"Experiment versus observation is the K-2 root of V1 11-12.B.2.2c."},{"id":"3-5.B.2.2a","band":"3-5","concept":"B.2.2","text":"Decide whether a question can be answered by doing an experiment or only by observing what happens.","change":"Unchanged","from":["K-2.B.2.2a"],"why":""},{"id":"3-5.B.2.2b","band":"3-5","concept":"B.2.2","text":"Describe how picking by chance (e.g., drawing names from a hat) makes it fair when deciding who gets which treatment or group.","change":"Revised","from":["D.1.7"],"why":"Assigning groups by chance is V1 randomization at 3-5."},{"id":"6-8.B.2.2a","band":"6-8","concept":"B.2.2","text":"Explain how a study's design, including whether randomization was possible, determines what type of question it can answer.","change":"Revised","from":["3-5.D.1.7a"],"why":""},{"id":"6-8.B.2.2b","band":"6-8","concept":"B.2.2","text":"Explain that assigning people or things to groups by chance helps make the groups fair to compare.","change":"Revised","from":["6-8.B.2.1a"],"why":""},{"id":"9-10.B.2.2a","band":"9-10","concept":"B.2.2","text":"Compare experimental and observational study designs and explain how each determines whether a causal claim or only an association can be supported.","change":"Revised","from":["6-8.D.1.7a"],"why":""},{"id":"9-10.B.2.2b","band":"9-10","concept":"B.2.2","text":"Explain how random assignment balances groups on both known and unknown variables, and distinguish it from random sampling. Evaluate when random assignment is feasible or ethical, and explain what can be concluded when it is not.","change":"Revised","from":["11-12.B.2.2c","9-10.B.2.2e"],"why":""},{"id":"11-12.B.2.2a","band":"11-12","concept":"B.2.2","text":"Critique the design of a published study (randomization, control group, blinding, potential confounders) and judge whether its causal claim is warranted.","change":"Revised","from":["9-10.D.1.7a"],"why":""},{"id":"K-2.B.2.3a","band":"K-2","concept":"B.2.3","text":"Recognize that data is often collected by other people and can be found in places like books, websites, and classroom resources.","change":"Revised","from":["B.2.4"],"why":"Data found in books and websites is V1 finding secondary data at K-2."},{"id":"3-5.B.2.3a","band":"3-5","concept":"B.2.3","text":"Locate and retrieve provided datasets from age-appropriate data repositories (e.g., a simple table of animal populations or weather readings).","change":"Revised","from":["K-2.B.2.4a","K-2.B.2.4b"],"why":""},{"id":"3-5.B.2.3b","band":"3-5","concept":"B.2.3","text":"Identify basic criteria for whether a secondary dataset is relevant to a question (e.g., match of topic, timeframe, and geography).","change":"Revised","from":["3-5.B.2.4a"],"why":""},{"id":"6-8.B.2.3a","band":"6-8","concept":"B.2.3","text":"Locate and retrieve secondary datasets appropriate to a question from educational repositories and curated public sources (e.g., data.gov, My NASA Data, CODAP sample datasets).","change":"Revised","from":["3-5.B.2.4b"],"why":""},{"id":"6-8.B.2.3b","band":"6-8","concept":"B.2.3","text":"Evaluate secondary datasets based on relevance, timeframe of the data, and source credibility.","change":"Revised","from":["6-8.B.2.4a"],"why":""},{"id":"6-8.B.2.3c","band":"6-8","concept":"B.2.3","text":"Use a secondary dataset's documentation or metadata to identify who collected it, how it was measured, and who or what was included or excluded, in order to understand what the dataset can and cannot show.","change":"Revised","from":["6-8.B.2.4b"],"why":""},{"id":"9-10.B.2.3a","band":"9-10","concept":"B.2.3","text":"Access and appropriately cite secondary datasets from publicly available scientific, civic, or government sources, including when using data in place (via online dashboards or queries) without downloading it.","change":"Revised","from":["6-8.B.2.4c","6-8.B.3.2a","6-8.B.3.2b","6-8.B.3.2c"],"why":""},{"id":"9-10.B.2.3b","band":"9-10","concept":"B.2.3","text":"Evaluate secondary datasets from multiple sources to determine which best fits a research question in terms of relevance, measurement quality, and recency.","change":"Revised","from":["9-10.B.2.4a"],"why":""},{"id":"9-10.B.2.3c","band":"9-10","concept":"B.2.3","text":"Explain how the original collectors' decisions about who or what to include or exclude shape the conclusions a secondary dataset can support.","change":"Revised","from":["11-12.B.3.2a","11-12.B.3.2b"],"why":""},{"id":"11-12.B.2.3a","band":"11-12","concept":"B.2.3","text":"Identify non-publicly available datasets and pursue access through appropriate channels (e.g., researchers, published literature, public agencies, data-use agreements), navigating licensing and citation requirements.","change":"Revised","from":["9-10.B.3.2b"],"why":""},{"id":"11-12.B.2.3b","band":"11-12","concept":"B.2.3","text":"Evaluate a secondary dataset's documentation and licensing to decide whether it can ethically and validly be used for a new purpose different from the one for which it was originally collected.","change":"Added","from":["B.2.4","C.1.6"],"why":"Documentation and licensing for reuse joins secondary data to V1 metadata."},{"id":"K-2.B.3.1a","band":"K-2","concept":"B.3.1","text":"Recognize that data about people, including yourself, should be protected and you need to ask permission before collecting or sharing others' information.","change":"Unchanged","from":["B.3.3"],"why":"Permission before collecting or sharing is V1 ethics of data collection at K-2."},{"id":"3-5.B.3.1a","band":"3-5","concept":"B.3.1","text":"Describe how some data identifies individuals, and explain why sharing personal data online can be permanent.","change":"Revised","from":["K-2.B.3.3a","K-2.B.3.3b"],"why":""},{"id":"6-8.B.3.1a","band":"6-8","concept":"B.3.1","text":"Identify what data about yourself is collected by apps and websites, and use basic privacy controls to manage it.","change":"Revised","from":["3-5.B.3.3a"],"why":""},{"id":"6-8.B.3.1b","band":"6-8","concept":"B.3.1","text":"Examine how data practices can cause harm and affect groups unevenly, using relevant (historical and present day) examples.","change":"Unchanged","from":["B.3.3","A.2.1"],"why":"Uneven harm with historical examples joins collection ethics to data use risks."},{"id":"6-8.B.3.1c","band":"6-8","concept":"B.3.1","text":"Give an example of how combining two datasets could reveal who someone is, even when neither one names them individually.","change":"Revised","from":["6-8.B.3.3b"],"why":""},{"id":"9-10.B.3.1a","band":"9-10","concept":"B.3.1","text":"Evaluate privacy risks when collecting, storing, and sharing data, and explain what informed consent requires.","change":"Revised","from":["B.3.3","A.2.1"],"why":"Privacy risk and informed consent joins collection ethics to data use risks."},{"id":"9-10.B.3.1b","band":"9-10","concept":"B.3.1","text":"Analyze a dataset for under-representation, skewed measurement, or missing groups that could lead to unfair conclusions or discriminatory models.","change":"Revised","from":["9-10.B.3.3a"],"why":""},{"id":"9-10.B.3.1c","band":"9-10","concept":"B.3.1","text":"Explain how combining multiple datasets can re-identify individuals who appear anonymous in each alone, and evaluate the limits of anonymization techniques.","change":"Unchanged","from":["9-10.B.3.3b"],"why":""},{"id":"11-12.B.3.1a","band":"11-12","concept":"B.3.1","text":"Apply and evaluate a de-identification technique (e.g., aggregation, suppression, or adding random noise) and explain why even de-identified data can sometimes be re-identified.","change":"Revised","from":["11-12.B.3.3b"],"why":""},{"id":"3-5.B.3.2a","band":"3-5","concept":"B.3.2","text":"Recognize that computers and phones use energy to work, and describe one way that affects the environment.","change":"Revised","from":["E.3.4"],"why":"Device energy use matches V1 3-5.E.3.4a on energy consumption."},{"id":"6-8.B.3.2a","band":"6-8","concept":"B.3.2","text":"Explain that storing data and running large computing or AI systems consume significant energy and resources, and describe one consequence of that.","change":"Revised","from":["K-2.E.3.4a"],"why":""},{"id":"9-10.B.3.2a","band":"9-10","concept":"B.3.2","text":"Describe ethical limitations of AI tools, including privacy, copyright, environmental costs, labor costs, and potential for harmful outputs.","change":"Unchanged","from":["3-5.E.3.4a"],"why":""},{"id":"9-10.B.3.2b","band":"9-10","concept":"B.3.2","text":"Critique societal effects of AI including algorithmic bias, accountability, transparency, and impacts on privacy and employment.","change":"Unchanged","from":["9-10.C.4.2a"],"why":""},{"id":"11-12.B.3.2a","band":"11-12","concept":"B.3.2","text":"Evaluate the trade-offs between the benefits of a specific data or AI system and its environmental and human costs (energy use, water consumption, labor conditions), and propose mitigations with evidence of feasibility.","change":"Revised","from":["11-12.C.4.2a"],"why":""},{"id":"K-2.B.4.1a","band":"K-2","concept":"B.4.1","text":"Sort individual observations, each on a unique 'case card,' into groups by a shared feature.","change":"Revised","from":["B.1.2"],"why":"Case cards sorted by a shared feature matches V1 K-2.B.1.2a."},{"id":"K-2.B.4.1b","band":"K-2","concept":"B.4.1","text":"Work with small datasets of 1-2 variables and 10-20 observations/cases.","change":"Revised","from":["K-2.B.1.2a","K-2.B.1.2b","K-2.B.1.3a"],"why":""},{"id":"K-2.B.4.1c","band":"K-2","concept":"B.4.1","text":"Sort, count, and describe both categorical and numeric data.","change":"Added","from":["K-2.B.4.3a"],"why":""},{"id":"3-5.B.4.1a","band":"3-5","concept":"B.4.1","text":"Organize data with multiple variables so each row is one observation/case and each column is a variable.","change":"Revised","from":["B.1.2"],"why":"One row per case, one column per variable, is V1 organizing and structure."},{"id":"3-5.B.4.1b","band":"3-5","concept":"B.4.1","text":"Explore datasets of 2-4 variables and 20-100 cases.","change":"Revised","from":["3-5.B.1.2a"],"why":""},{"id":"3-5.B.4.1c","band":"3-5","concept":"B.4.1","text":"Use a dataset's description to find out what each column means.","change":"Revised","from":["C.1.6"],"why":"Reading a dataset description to learn what a column means is V1 metadata."},{"id":"3-5.B.4.1d","band":"3-5","concept":"B.4.1","text":"Recognize the difference between numerical and categorical data and identify which type a variable is.","change":"Revised","from":["3-5.B.4.2a","3-5.B.4.2b"],"why":""},{"id":"6-8.B.4.1a","band":"6-8","concept":"B.4.1","text":"Work with data where each case contains a list of related values (e.g., a student record with several test scores).","change":"Revised","from":["3-5.B.4.3a"],"why":""},{"id":"6-8.B.4.1b","band":"6-8","concept":"B.4.1","text":"Work with datasets of 5-10 variables and hundreds of cases using computer-based tools.","change":"Revised","from":["6-8.B.1.2a"],"why":""},{"id":"6-8.B.4.1c","band":"6-8","concept":"B.4.1","text":"Use a dataset's documentation to understand its structure and variable types before analysis.","change":"Revised","from":["6-8.B.1.2b"],"why":""},{"id":"9-10.B.4.1a","band":"9-10","concept":"B.4.1","text":"Work with large datasets (thousands of observations) that are too big to take in at once, using computer-based tools to filter or sample them for exploration.","change":"Revised","from":["9-10.B.1.2a"],"why":""},{"id":"9-10.B.4.1b","band":"9-10","concept":"B.4.1","text":"Create clear documentation systems for a dataset so others can understand its variables, units, and origins.","change":"Revised","from":["9-10.B.1.2b"],"why":""},{"id":"11-12.B.4.1a","band":"11-12","concept":"B.4.1","text":"Organize large or growing datasets in consistent ways so that when data is added or values are missing, the dataset remains usable.","change":"Revised","from":["9-10.B.1.2c"],"why":""},{"id":"11-12.B.4.1b","band":"11-12","concept":"B.4.1","text":"Design documentation systems that track where data came from and how it was reorganized or transformed (data lineage).","change":"Revised","from":["11-12.B.1.2a"],"why":""},{"id":"K-2.B.4.2a","band":"K-2","concept":"B.4.2","text":"Check that there are enough responses so all cases are accounted for; identify when a value is missing.","change":"Revised","from":["B.1.1","C.1.5"],"why":"Accounting for all cases and spotting a missing value joins data cleaning to V1 missingness."},{"id":"K-2.B.4.2b","band":"K-2","concept":"B.4.2","text":"Work with datasets that are already clean.","change":"Revised","from":["K-2.B.4.1a"],"why":""},{"id":"3-5.B.4.2a","band":"3-5","concept":"B.4.2","text":"Check data for obvious mistakes by comparing a few recorded values against the original source.","change":"Revised","from":["K-2.B.4.1a"],"why":""},{"id":"3-5.B.4.2b","band":"3-5","concept":"B.4.2","text":"Recognize that some datasets contain blanks, inconsistent entries, or unit errors that need attention before use.","change":"Revised","from":["3-5.B.4.1a","3-5.B.4.1b"],"why":""},{"id":"3-5.B.4.2c","band":"3-5","concept":"B.4.2","text":"Find unrealistic values or recording errors and correct them only when the correct value is clearly knowable (e.g., an obvious unit error), documenting any change made.","change":"Revised","from":["3-5.B.4.1b"],"why":""},{"id":"6-8.B.4.2a","band":"6-8","concept":"B.4.2","text":"Identify codes used for missing or incomplete data (e.g., blanks, 'NA,' 999), decide how to handle them (flag, recode, or note why), and explain the effect of that choice","change":"Revised","from":["3-5.B.1.1b"],"why":""},{"id":"6-8.B.4.2b","band":"6-8","concept":"B.4.2","text":"Flag values that look unusual, investigate whether they represent errors or genuine variation, and document the decision.","change":"Revised","from":["6-8.B.4.1a"],"why":""},{"id":"6-8.B.4.2c","band":"6-8","concept":"B.4.2","text":"Notice and address common data problems beyond missing values: duplicate records, inconsistent categories or formats (e.g., 'NY' vs. 'New York'), and values that fall outside a realistic range, choosing and documenting an appropriate cleaning technique for each.","change":"Revised","from":["6-8.B.4.1b"],"why":""},{"id":"6-8.B.4.2d","band":"6-8","concept":"B.4.2","text":"Distinguish between true zero values and blank cells.","change":"Unchanged","from":["6-8.B.4.1a","9-10.B.4.1a"],"why":""},{"id":"9-10.B.4.2a","band":"9-10","concept":"B.4.2","text":"Detect and resolve data-quality issues that arise when combining multiple sources, including structural inconsistencies and mismatched formats, and choose an appropriate cleaning technique for each.","change":"Revised","from":["9-10.B.4.1a"],"why":""},{"id":"11-12.B.4.2a","band":"11-12","concept":"B.4.2","text":"Develop and document reproducible data-cleaning workflows that maintain integrity.","change":"Unchanged","from":["9-10.B.4.1b"],"why":""},{"id":"11-12.B.4.2b","band":"11-12","concept":"B.4.2","text":"Compare the effect of different missing-data strategies (complete-case deletion, mean imputation, multiple imputation) on a result, and explain which is most appropriate for a given scenario.","change":"Revised","from":["11-12.B.4.1a"],"why":""},{"id":"K-2.B.4.3a","band":"K-2","concept":"B.4.3","text":"Sort or group a set of objects or case cards by a shared feature, and notice what you can see more easily after sorting.","change":"Added","from":["B.1.3"],"why":"Sorting to make a pattern visible is V1 processing and transformation at K-2."},{"id":"3-5.B.4.3a","band":"3-5","concept":"B.4.3","text":"Group or order data in different ways and notice how the arrangement changes what stands out.","change":"Unchanged","from":["B.1.3"],"why":"Grouping and ordering to change what stands out is V1 processing and transformation."},{"id":"3-5.B.4.3b","band":"3-5","concept":"B.4.3","text":"Combine information from two datasets about the same objects by matching a shared feature (a join).","change":"Revised","from":["3-5.B.1.3a"],"why":""},{"id":"3-5.B.4.3c","band":"3-5","concept":"B.4.3","text":"Create a new variable through a simple calculation, and explain how it changes the patterns you can see in the data.","change":"Revised","from":["3-5.B.4.4a"],"why":""},{"id":"3-5.B.4.3d","band":"3-5","concept":"B.4.3","text":"Apply the same data move in the same way each time you use it, so that your results are consistent and someone else could follow your steps and get the same outcome.","change":"Revised","from":["3-5.B.4.4b"],"why":""},{"id":"6-8.B.4.3a","band":"6-8","concept":"B.4.3","text":"Group numerical values into bins and notice how the choice of bins changes the patterns you see.","change":"Unchanged","from":["B.1.3"],"why":"Binning numerical values matches V1 6-8.B.1.3a."},{"id":"6-8.B.4.3b","band":"6-8","concept":"B.4.3","text":"Create derived variables that combine multiple measurements, including rates and ratios.","change":"Unchanged","from":["6-8.B.1.3a"],"why":""},{"id":"6-8.B.4.3c","band":"6-8","concept":"B.4.3","text":"Record a sequence of data moves (such as filter, group, then compute a summary) as a numbered list of steps precise enough that someone else could follow them and get the same result.","change":"Revised","from":["6-8.B.1.3b"],"why":""},{"id":"6-8.B.4.3d","band":"6-8","concept":"B.4.3","text":"Combine two datasets by matching cases on a shared variable (a join), and explain what new questions the combined dataset allows you to answer.","change":"Revised","from":["B.4.4","B.1.3"],"why":"Joining two datasets on a shared variable is V1 complexity of structure."},{"id":"9-10.B.4.3a","band":"9-10","concept":"B.4.3","text":"Construct new categorical variables using if/then logic in a computer-based tool, and filter data into relevant subsets using those conditions.","change":"Revised","from":["B.1.3"],"why":"If/then variable construction and filtering matches V1 9-10.B.1.3a and 9-10.B.1.3b."},{"id":"9-10.B.4.3b","band":"9-10","concept":"B.4.3","text":"Merge multiple datasets by matching on a shared identifier (key), maintain consistent case structure, and recognize that combining sources that sampled or measured differently can distort results.","change":"Revised","from":["B.4.4"],"why":"Merging on a key while holding case structure is V1 complexity of structure."},{"id":"9-10.B.4.3c","band":"9-10","concept":"B.4.3","text":"Treat data moves as repeatable, rule-based operations and carry them out using a no-code, low-code, or code-based tool as appropriate.","change":"Revised","from":["9-10.B.1.3a","9-10.B.1.3b"],"why":""},{"id":"9-10.B.4.3d","band":"9-10","concept":"B.4.3","text":"Explain how secondary data's grouping or aggregation (e.g., time period, geographic unit, how recently it was updated) affects which questions you can investigate with it.","change":"Added","from":["11-12.B.1.3a"],"why":""},{"id":"11-12.B.4.3a","band":"11-12","concept":"B.4.3","text":"Design joins across datasets using identifying variables, accounting for differences in observation structure.","change":"Unchanged","from":["B.4.4"],"why":"Designing joins across differing observation structures is V1 complexity of structure."},{"id":"11-12.B.4.3b","band":"11-12","concept":"B.4.3","text":"Build a reproducible data pipeline using a low-code or code-based tool that re-runs when the source data updates, validating inputs against expected structure and documenting each step so others can understand and reproduce the process.","change":"Unchanged","from":["C.4.5"],"why":"A reproducible pipeline that re-runs is V1 the role of code in data analysis."},{"id":"K-2.C.1.1a","band":"K-2","concept":"C.1.1","text":"Observe differences when measuring or characterizing objects, people, and opinions (i.e., data varies).","change":"Unchanged","from":["A.1.3"],"why":"Observing that data varies is V1 variability of data at K-2."},{"id":"3-5.C.1.1a","band":"3-5","concept":"C.1.1","text":"Notice that values in some groups vary more than in others, and describe how what we can predict from data is affected by ho
