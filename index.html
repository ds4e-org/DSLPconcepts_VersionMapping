w much the values differ.","change":"Revised","from":["A.1.3","C.3.2"],"why":"Some groups varying more than others joins variability of data to comparing variability."},{"id":"6-8.C.1.1a","band":"6-8","concept":"C.1.1","text":"Recognize that variation is a normal and expected feature of data, not a sign that something went wrong, and that accepting this is the starting point for making sense of any dataset.","change":"Revised","from":["K-2.A.1.3a"],"why":""},{"id":"9-10.C.1.1a","band":"9-10","concept":"C.1.1","text":"Reason about how the amount of variation in a dataset affects what conclusions can and cannot be drawn, and explain why more variation means less certainty in predictions.","change":"Revised","from":["3-5.A.1.3b"],"why":""},{"id":"K-2.C.1.2a","band":"K-2","concept":"C.1.2","text":"Explore a set of data (a list, table, or picture) and notice what stands out like a value that repeats a lot, or one that looks unusual.","change":"Unchanged","from":["9-10.A.1.3a"],"why":""},{"id":"3-5.C.1.2a","band":"3-5","concept":"C.1.2","text":"Recognize that exploring data often surfaces new questions worth investigating.","change":"Revised","from":["11-12.A.1.3a"],"why":""},{"id":"3-5.C.1.2b","band":"3-5","concept":"C.1.2","text":"Use more than one dataset, or more than one view of a dataset, to answer a question.","change":"Revised","from":["A.3.2"],"why":"Using more than one view of a dataset matches V1 K-2.A.3.2a on different views."},{"id":"6-8.C.1.2a","band":"6-8","concept":"C.1.2","text":"Identify new questions that exploring a dataset raises, including ones that cannot be answered with the current data and require additional sources of data.","change":"Unchanged","from":["3-5.A.3.2a"],"why":""},{"id":"6-8.C.1.2b","band":"6-8","concept":"C.1.2","text":"Use one or more datasets to generate multiple inferences about a phenomenon, recognizing that the same data can inform different questions.","change":"Added","from":["3-5.A.3.2a"],"why":""},{"id":"9-10.C.1.2a","band":"9-10","concept":"C.1.2","text":"Use gaps, surprises, and patterns noticed while exploring data to generate and refine investigative questions.","change":"Unchanged","from":["A.3.2","B.2.1"],"why":"Gaps and surprises refining questions joins iteration to investigation design."},{"id":"11-12.C.1.2a","band":"11-12","concept":"C.1.2","text":"Synthesize observations across multiple explorations of a dataset with different variables, and generate questions requiring multiple sources of data to answer.","change":"Unchanged","from":["6-8.A.3.2a"],"why":""},{"id":"K-2.C.2.1a","band":"K-2","concept":"C.2.1","text":"Organize objects, or pictures of objects, by a shared feature, and show the groups using position, stacking, or color.","change":"Revised","from":["E.1.1","C.2.2"],"why":"Showing groups by position, stacking, or color is V1 sense-making with visualizations."},{"id":"K-2.C.2.1b","band":"K-2","concept":"C.2.1","text":"Arrange numerical data in order along a number line, with cases shown by pictures, icons, or the objects themselves.","change":"Unchanged","from":["E.1.1"],"why":"Ordering cases along a number line is V1 sense-making with visualizations."},{"id":"K-2.C.2.1c","band":"K-2","concept":"C.2.1","text":"Use different views such as pictures, tallies, graphs, or charts to help answer questions and notice patterns.","change":"Added","from":["K-2.C.2.2a"],"why":""},{"id":"3-5.C.2.1a","band":"3-5","concept":"C.2.1","text":"Visualize categorical data so categories can be easily compared (e.g., a bar graph of counts where each bar is built from one block per case).","change":"Revised","from":["E.1.1"],"why":"A bar graph built one block per case matches V1 3-5.E.1.1a and K-2.E.1.1b."},{"id":"3-5.C.2.1b","band":"3-5","concept":"C.2.1","text":"Visualize the distribution of numerical data as a dot plot (also called a line plot) on a number line, with identical values stacked.","change":"Revised","from":["K-2.E.1.2a"],"why":""},{"id":"6-8.C.2.1a","band":"6-8","concept":"C.2.1","text":"Compare a relative-frequency bar graph with the same data shown as a pie graph to consider the benefits and drawbacks of each type of graph.","change":"Unchanged","from":["3-5.E.1.1a"],"why":""},{"id":"6-8.C.2.1b","band":"6-8","concept":"C.2.1","text":"Visualize a numerical data distribution as dot plots, box plots, and histograms using hand drawings or a computer-based tool, and explain how scale and binning choices impact the visualization.","change":"Revised","from":["C.2.2","E.1.2"],"why":"Dot plots, box plots, and histograms match V1 6-8.C.2.2a and investigate with visualizations."},{"id":"9-10.C.2.1a","band":"9-10","concept":"C.2.1","text":"Create and compare categorical visualizations (frequency bar, pie, relative-frequency bar) using a computer-based tool, and judge which best communicates differences or similarities among categories.","change":"Unchanged","from":["3-5.E.1.2b"],"why":""},{"id":"9-10.C.2.1b","band":"9-10","concept":"C.2.1","text":"Create multiple visualizations of the same numerical data using a computer-based tool to reveal different features, exploring how binning, axis limits, and scale change what is shown.","change":"Unchanged","from":["3-5.E.1.1a"],"why":""},{"id":"11-12.C.2.1a","band":"11-12","concept":"C.2.1","text":"Choose and create displays for categorical data with many levels or hierarchies (e.g., a treemap or sorted grouped bar chart), justifying the choice.","change":"Revised","from":["6-8.C.2.2a","6-8.E.1.2b"],"why":""},{"id":"11-12.C.2.1b","band":"11-12","concept":"C.2.1","text":"Create density plots or cumulative distribution plots and explain when they reveal more than a histogram does.","change":"Added","from":["C.2.2","E.1.6"],"why":"Density and cumulative plots extend V1 understanding distributions and visual-type matching."},{"id":"K-2.C.2.2a","band":"K-2","concept":"C.2.2","text":"Visualize how something changes over time using numeric or categorical data (e.g., the temperature each day, or whether you needed an umbrella each day).","change":"Unchanged","from":["C.2.3"],"why":"Change over time is V1 defining relationships at K-2."},{"id":"K-2.C.2.2b","band":"K-2","concept":"C.2.2","text":"Use a simple map (of a classroom or playground) to show the location of where things or people are.","change":"Unchanged","from":["C.2.4","E.1.1"],"why":"A simple location map is V1 analyzing non-traditional data (geospatial) at K-2."},{"id":"3-5.C.2.2a","band":"3-5","concept":"C.2.2","text":"Visualize how a numerical variable changes over time in a time-series graph (i.e., a line graph), with increments of time on the x-axis.","change":"Revised","from":["C.2.3"],"why":"Matches V1 3-5.C.2.3a on time-series graphs."},{"id":"3-5.C.2.2b","band":"3-5","concept":"C.2.2","text":"Add one categorical or numerical variable to a map using color or symbols, and identify where high or low values of that variable cluster.","change":"Revised","from":["3-5.C.2.3a"],"why":""},{"id":"3-5.C.2.2c","band":"3-5","concept":"C.2.2","text":"Create a single dot plot of numeric data where each dot is colored by a categorical variable.","change":"Revised","from":["E.1.1"],"why":"Colouring cases by a categorical variable matches V1 3-5.E.1.1b."},{"id":"3-5.C.2.2d","band":"3-5","concept":"C.2.2","text":"Create two dot plots side by side, one for each category, showing the same numerical variable's distribution across the two groups.","change":"Revised","from":["3-5.C.2.3a"],"why":""},{"id":"6-8.C.2.2a","band":"6-8","concept":"C.2.2","text":"Visualize how two or more numerical variables change over time on a shared time axis.","change":"Revised","from":["6-8.E.1.1c"],"why":""},{"id":"6-8.C.2.2b","band":"6-8","concept":"C.2.2","text":"Use color or shading to show how a value varies from place to place across a region, and compare two maps of the same region to identify spatial patterns.","change":"Revised","from":["C.2.4"],"why":"Shading values by place matches V1 9-10.C.2.4b on geographic data."},{"id":"6-8.C.2.2c","band":"6-8","concept":"C.2.2","text":"Create scatterplots for pairs of numerical variables.","change":"Revised","from":["C.2.3","E.1.2"],"why":"Matches V1 6-8.C.2.3b on scatterplots."},{"id":"6-8.C.2.2d","band":"6-8","concept":"C.2.2","text":"Create two-way tables and side-by-side bar graphs to show frequencies of two categorical variables together.","change":"Revised","from":["3-5.C.2.3a","6-8.C.2.3a"],"why":""},{"id":"6-8.C.2.2e","band":"6-8","concept":"C.2.2","text":"Create parallel boxplots, histograms, maps, or dotplots to compare the distribution of a numeric variable across several groups.","change":"Unchanged","from":["6-8.E.1.1c"],"why":""},{"id":"9-10.C.2.2a","band":"9-10","concept":"C.2.2","text":"Visualize multiple numerical variables that change over time by indexing each series to a common starting point or plotting them on shared axes with deliberate scale choices.","change":"Revised","from":["6-8.C.2.3b","6-8.E.1.2c"],"why":""},{"id":"9-10.C.2.2b","band":"9-10","concept":"C.2.2","text":"Design the color scale and legend of a choropleth map so that a reader can interpret regional differences accurately.","change":"Revised","from":["E.1.3","C.2.4"],"why":"Designing a choropleth colour scale joins clear design to geospatial data."},{"id":"9-10.C.2.2c","band":"9-10","concept":"C.2.2","text":"Visualize two numeric variables with a scatterplot and use color for a categorical variable to show subsets of cases, or split into parallel scatterplots one for each subset of cases by the categorical variable.","change":"Revised","from":["6-8.C.2.1a"],"why":""},{"id":"9-10.C.2.2d","band":"9-10","concept":"C.2.2","text":"Visualize two categorical variables through stacked bar graphs (frequencies) and segmented bar graphs (relative frequencies).","change":"Revised","from":["3-5.C.2.3a"],"why":""},{"id":"9-10.C.2.2e","band":"9-10","concept":"C.2.2","text":"Read a simple network diagram (nodes and edges) and describe what the nodes represent, what the edges mean, and which nodes appear most connected.","change":"Added","from":["6-8.E.1.1c"],"why":""},{"id":"11-12.C.2.2a","band":"11-12","concept":"C.2.2","text":"Visualize trends over time using measures such as cumulative totals or moving averages on a time-series graph.","change":"Unchanged","from":["C.2.3"],"why":"Moving averages and cumulative totals extend V1 time-series work."},{"id":"11-12.C.2.2b","band":"11-12","concept":"C.2.2","text":"Detect when data spanning several orders of magnitude calls for a log scale, and create log-scaled visualizations (e.g., a scatterplot or time series on a log axis), explaining what the log scale reveals or hides","change":"Revised","from":["E.1.5"],"why":"Log scaling is a layout and scale choice, V1 representational fluency."},{"id":"11-12.C.2.2c","band":"11-12","concept":"C.2.2","text":"Use a color scale to create a heatmap from a two-way table to visualize association.","change":"Unchanged","from":["E.1.3","C.1.4"],"why":"A heatmap from a two-way table joins clear design to frequency tables."},{"id":"11-12.C.2.2d","band":"11-12","concept":"C.2.2","text":"Justify how choices about regional boundaries, binning, or map scale change what a spatial visualization emphasizes or hides.","change":"Revised","from":["E.1.5"],"why":"How boundaries and binning change emphasis is V1 representational fluency."},{"id":"11-12.C.2.2e","band":"11-12","concept":"C.2.2","text":"Visualize relationships among multiple variables using network graphs made of nodes (points or entities) and edges (lines or connections), using color to add information.","change":"Unchanged","from":["E.1.6","C.2.4"],"why":"Network graphs extend matching visualization type to data type."},{"id":"K-2.C.3.1a","band":"K-2","concept":"C.3.1","text":"Identify the largest, smallest, and most frequent values (mode) in a set of numbers.","change":"Revised","from":["C.1.1","C.1.2"],"why":"Largest, smallest, and mode join V1 measures of center and spread."},{"id":"K-2.C.3.1b","band":"K-2","concept":"C.3.1","text":"Count the number of cases in each category and identify which has most/least.","change":"Unchanged","from":["C.1.4","C.1.1"],"why":"Counting cases per category and finding most or least is V1 frequency tables."},{"id":"K-2.C.3.1c","band":"K-2","concept":"C.3.1","text":"Notice how data values are grouped close together and how they are spread apart, or vary, from one another.","change":"Unchanged","from":["C.1.3","C.3.1"],"why":"Clustered versus spread out joins V1 shape to describing variability."},{"id":"3-5.C.3.1a","band":"3-5","concept":"C.3.1","text":"Find the most common value and the middle value of an ordered list, and describe how far other values differ from them.","change":"Revised","from":["K-2.C.1.1b","K-2.C.1.2a"],"why":""},{"id":"3-5.C.3.1b","band":"3-5","concept":"C.3.1","text":"Describe the variability and shape of a numerical distribution by noting the min/max, range, and where data may be clustered, more spread out, or have unusual values.","change":"Unchanged","from":["K-2.B.1.4a"],"why":""},{"id":"3-5.C.3.1c","band":"3-5","concept":"C.3.1","text":"Describe the relative frequency of categories using fractions.","change":"Unchanged","from":["K-2.C.1.2a"],"why":""},{"id":"6-8.C.3.1a","band":"6-8","concept":"C.3.1","text":"Identify, calculate, and explain measures of center (mean, median, mode) using calculations by hand or a computer-based tool, and describe how each measure behaves differently with different distributions.","change":"Revised","from":["3-5.C.1.1a"],"why":""},{"id":"6-8.C.3.1b","band":"6-8","concept":"C.3.1","text":"Describe the shape of a numerical distribution (symmetry, number of modes or clumps, informally identified outliers) and of a categorical distribution (most and least common categories).","change":"Revised","from":["3-5.C.1.2a","3-5.C.1.3a","K-2.C.1.3a"],"why":""},{"id":"6-8.C.3.1c","band":"6-8","concept":"C.3.1","text":"Compare distributions in terms of variability, including measures such as range, interquartile range (IQR), and mean absolute deviation (MAD).","change":"Revised","from":["3-5.C.1.4a"],"why":""},{"id":"6-8.C.3.1d","band":"6-8","concept":"C.3.1","text":"Describe the relative frequency of categories using percentages and ratios.","change":"Unchanged","from":["6-8.C.1.1a","6-8.C.1.1b"],"why":""},{"id":"9-10.C.3.1a","band":"9-10","concept":"C.3.1","text":"Explain the sensitivity of the mean to outliers relative to the median. Choose the appropriate measure of center for a distribution's shape and justify the choice.","change":"Revised","from":["3-5.C.1.3a","6-8.C.1.3a"],"why":""},{"id":"9-10.C.3.1b","band":"9-10","concept":"C.3.1","text":"Calculate, interpret, and compare standard deviation and IQR using a computer-based tool, explaining what each reveals and hides about variability.","change":"Revised","from":["6-8.C.1.2a","9-10.C.1.2a","9-10.C.1.2b"],"why":""},{"id":"11-12.C.3.1a","band":"11-12","concept":"C.3.1","text":"Use and interpret trimmed means, percentiles, and z-scores as measures of position, and explain when each is more informative than a simple measure of center.","change":"Revised","from":["3-5.C.1.4a","6-8.C.1.4a"],"why":""},{"id":"11-12.C.3.1b","band":"11-12","concept":"C.3.1","text":"Summarize and describe the distribution of a single variable by comparing its shape to standard probability distributions (including by overlaying one) and judging how close it is to normal, explaining what the comparison reveals.","change":"Revised","from":["9-10.C.1.3a","9-10.C.1.3b"],"why":""},{"id":"K-2.C.3.2a","band":"K-2","concept":"C.3.2","text":"Notice when two things tend to go together (e.g., taller students usually have longer arms).","change":"Revised","from":["11-12.C.1.1b"],"why":""},{"id":"K-2.C.3.2b","band":"K-2","concept":"C.3.2","text":"Identify the pattern of change (going up, going down, staying the same) of numerical data over time (e.g., days of the week, seasons, morning or afternoon).","change":"Revised","from":["C.2.3"],"why":"Direction of change over time is V1 defining relationships at K-2."},{"id":"3-5.C.3.2a","band":"3-5","concept":"C.3.2","text":"Informally describe whether two things tend to go together, using a dot plot colored by group or a two-way count.","change":"Revised","from":["C.2.1"],"why":"Whether two things go together is V1 comparing variables."},{"id":"3-5.C.3.2b","band":"3-5","concept":"C.3.2","text":"Compare distributions across groups using basic numerical summaries (relative counts; mode, median, range, min/max).","change":"Unchanged","from":["K-2.C.2.1a"],"why":""},{"id":"3-5.C.3.2c","band":"3-5","concept":"C.3.2","text":"Describe whether two categories tend to occur together (e.g., whether students who walk to school also tend to bring lunch).","change":"Unchanged","from":["C.2.1","C.1.4"],"why":"Co-occurrence of two categories joins comparing variables to frequency tables."},{"id":"3-5.C.3.2d","band":"3-5","concept":"C.3.2","text":"Describe time-series trends (e.g., going up, going down, staying the same, cycling up and down) and predict informally how the trend might continue beyond the time shown in the graph.","change":"Revised","from":["3-5.C.2.1a"],"why":""},{"id":"3-5.C.3.2e","band":"3-5","concept":"C.3.2","text":"Describe where data is dense and where it is sparse across a map.","change":"Unchanged","from":["3-5.B.1.4a","3-5.C.1.1a"],"why":""},{"id":"6-8.C.3.2a","band":"6-8","concept":"C.3.2","text":"Describe the direction (positive, negative, or none) and strength (on a spectrum from strong to weak) of an association shown in a scatterplot, and explain how adding a categorical third variable shown by color or grouping can reveal or change the pattern.","change":"Revised","from":["C.2.3"],"why":"Direction and strength of a scatterplot association is V1 defining relationships."},{"id":"6-8.C.3.2b","band":"6-8","concept":"C.3.2","text":"Use measures of center (including mean) and variability in quantitative distributions to compare two or more groups, including filtered subsets.","change":"Revised","from":["3-5.C.2.3a"],"why":""},{"id":"6-8.C.3.2c","band":"6-8","concept":"C.3.2","text":"Use frequencies and relative frequencies to consider association between two categorical variables.","change":"Unchanged","from":["C.1.4"],"why":"Relative frequencies for categorical association is V1 frequency tables."},{"id":"6-8.C.3.2d","band":"6-8","concept":"C.3.2","text":"Distinguish a genuine trend in changes over time from short-term ups and downs, and identify repeating or cyclical patterns (e.g., seasonal changes).","change":"Unchanged","from":["6-8.C.2.1a"],"why":""},{"id":"6-8.C.3.2e","band":"6-8","concept":"C.3.2","text":"Describe how a value changes across places (higher some areas, lower others), and tell a real regional difference from ordinary scatter.","change":"Unchanged","from":["6-8.C.3.2a","9-10.C.2.1a"],"why":""},{"id":"6-8.C.3.2f","band":"6-8","concept":"C.3.2","text":"Compare the pattern for a whole group with the patterns within its subgroups, and describe how they differ.","change":"Unchanged","from":["6-8.C.1.4a","9-10.C.1.4a"],"why":""},{"id":"9-10.C.3.2a","band":"9-10","concept":"C.3.2","text":"Use a computer-based tool to compute a correlation coefficient and fit an informal line or curve to describe the strength and nature (linear vs. non-linear) of a numerical relationship, note how far points fall from the fit (residuals), and consider how a third variable might change or explain the relationship.","change":"Revised","from":["3-5.C.2.3a"],"why":""},{"id":"9-10.C.3.2b","band":"9-10","concept":"C.3.2","text":"Use summary measures (mean, SD, quartiles) for numerical variables to compare two or more groups.","change":"Unchanged","from":["C.3.2","C.2.1"],"why":"Mean, SD, and quartiles across groups is V1 comparing variability."},{"id":"9-10.C.3.2c","band":"9-10","concept":"C.3.2","text":"Use conditional relative frequencies in a two-way table to judge whether two categorical variables are associated.","change":"Unchanged","from":["C.1.4"],"why":"Conditional relative frequencies is V1 frequency tables."},{"id":"9-10.C.3.2d","band":"9-10","concept":"C.3.2","text":"Compare how fast quantities change over time (rate of change) and distinguish cumulative totals from incremental change (e.g., total cases vs. new cases per day).","change":"Revised","from":["11-12.C.2.3a","6-8.C.2.3b"],"why":""},{"id":"9-10.C.3.2e","band":"9-10","concept":"C.3.2","text":"Identify spatial patterns (clusters, hotspots, gradients) and describe what they suggest about the phenomenon.","change":"Unchanged","from":["9-10.C.2.1a"],"why":""},{"id":"9-10.C.3.2f","band":"9-10","concept":"C.3.2","text":"Quantify whether subgroups show different trends than the overall data, and evaluate what might explain the difference.","change":"Revised","from":["9-10.C.1.4a"],"why":""},{"id":"11-12.C.3.2a","band":"11-12","concept":"C.3.2","text":"Describe the strength and nature of a numerical relationship using a correlation coefficient and fitted line, interpret r-squared informally as the proportion of variation explained, and identify the limits of correlation (non-linear relationships, outlier sensitivity, restricted range).","change":"Revised","from":["C.2.3","D.1.8"],"why":"Correlation coefficient, fitted line, and r-squared join defining relationships to multi-variable work."},{"id":"11-12.C.3.2b","band":"11-12","concept":"C.3.2","text":"Compare a numerical variable across several groups and judge whether the differences are meaningful or likely just the variation you'd expect by chance from one sample to another.","change":"Revised","from":["C.3.2","D.1.4"],"why":"Judging whether group differences exceed chance joins comparing variability to significance."},{"id":"11-12.C.3.2c","band":"11-12","concept":"C.3.2","text":"Interpret the association between two categorical variables from a two-way table, and recognize when one or more other variables may be confounding or reversing the apparent association.","change":"Revised","from":["C.1.4","D.3.6"],"why":"Confounding behind a two-way table is V1 subset effects."},{"id":"11-12.C.3.2d","band":"11-12","concept":"C.3.2","text":"Forecast by extrapolating a trend while explaining that uncertainty grows the further out you project. Use smoothing (e.g., moving averages) to separate signal from noise in a time series.","change":"Revised","from":["11-12.C.2.3a"],"why":""},{"id":"11-12.C.3.2e","band":"11-12","concept":"C.3.2","text":"Examine whether subgroups show different trends that a confounding variable could be hiding or reversing (i.e., Simpson's Paradox).","change":"Revised","from":["11-12.C.2.1a"],"why":""},{"id":"11-12.C.3.2f","band":"11-12","concept":"C.3.2","text":"Summarize the structure of a network by describing which nodes are most central or influential and where tightly connected clusters form, recognizing that in network data the connections between entities are themselves the data, in addition to attributes of individual cases.","change":"Revised","from":["11-12.C.1.4a"],"why":""},{"id":"11-12.C.3.2g","band":"11-12","concept":"C.3.2","text":"Reason that nearby places tend to be more alike than distant ones, and judge when location itself helps explain a pattern versus when it's coincidental.","change":"Revised","from":["C.2.4"],"why":"Spatial autocorrelation extends V1 geospatial work in non-traditional data."},{"id":"K-2.C.4.1a","band":"K-2","concept":"C.4.1","text":"Notice that measuring the same thing more than once can give different answers, and that these differences are natural, not a mistake.","change":"Revised","from":["C.3.3","B.3.1"],"why":"Repeated measurement differing matches V1 K-2.B.3.1a and sources of variability."},{"id":"3-5.C.4.1a","band":"3-5","concept":"C.4.1","text":"Identify natural variability in a dataset and describe its likely source from context (e.g., plants differ in height because of genetics, soil, and water, not because of measurement error).","change":"Revised","from":["C.3.3"],"why":"Matches V1 3-5.C.3.3b on natural variability from data context."},{"id":"3-5.C.4.1b","band":"3-5","concept":"C.4.1","text":"Identify and describe measurement error as a source of variability in a dataset (e.g., different students measuring the same object get different results), and distinguish it from natural variation in what is being measured.","change":"Revised","from":["K-2.B.3.1a"],"why":""},{"id":"6-8.C.4.1a","band":"6-8","concept":"C.4.1","text":"Use context, repeated measurements, and dataset features to classify an unusual value as either a genuine pattern in the data, a likely measurement error, or a product of sampling variation, and describe the evidence for that classification.","change":"Revised","from":["C.3.3","C.1.2"],"why":"Classifying an unusual value matches V1 6-8.C.3.3a on meaningful versus erroneous outliers."},{"id":"6-8.C.4.1b","band":"6-8","concept":"C.4.1","text":"Describe how the sources of variability in a dataset (e.g., natural, measurement, or sampling) connect to the specific phenomena being studied.","change":"Revised","from":["3-5.C.3.3b"],"why":""},{"id":"9-10.C.4.1a","band":"9-10","concept":"C.4.1","text":"Assess the extent to which a dataset's variability is attributable to measurement error (e.g., imprecise instruments) versus natural or sampling variation, using repeated values and documentation as evidence.","change":"Revised","from":["6-8.C.3.3a"],"why":""},{"id":"9-10.C.4.1b","band":"9-10","concept":"C.4.1","text":"Distinguish among natural, measurement, sampling, and designed variability (variability introduced by treatment conditions in an experiment) as distinct sources of spread, and explain how each affects what the data can and cannot show.","change":"Revised","from":["6-8.C.3.3b"],"why":""},{"id":"11-12.C.4.1a","band":"11-12","concept":"C.4.1","text":"Given a measure and its dataset, reason about which sources of variability dominate between natural, measurement, sampling, or designed, and explain specifically how each source limits or strengthens the conclusions that the data can support.","change":"Unchanged","from":["9-10.C.3.3c"],"why":""},{"id":"3-5.C.4.2a","band":"3-5","concept":"C.4.2","text":"Examine a dataset from a small group. Describe what the data does and does not show about that group and whether you could describe a larger group from it.","change":"Revised","from":["D.3.2"],"why":"What a small group does and does not show about a larger one is V1 sample versus population."},{"id":"3-5.C.4.2b","band":"3-5","concept":"C.4.2","text":"Compare two datasets on the same topic and describe differences in their patterns, identifying features of the data such as who was included, how it was collected, or when that could explain why the patterns differ.","change":"Unchanged","from":["K-2.D.3.1a"],"why":""},{"id":"6-8.C.4.2a","band":"6-8","concept":"C.4.2","text":"Describe how an observed pattern in a dataset changes or disappears when the data is broken into subgroups or compared across different times or locations, and identify features of the data or the phenomenon itself that might explain the difference.","change":"Revised","from":["3-5.D.3.1a"],"why":""},{"id":"6-8.C.4.2b","band":"6-8","concept":"C.4.2","text":"Look at a difference between groups and informally judge whether it is likely a real difference or the kind of difference that normal variation would produce anyway.","change":"Revised","from":["C.3.3","D.1.4"],"why":"Judging a group difference against normal variation matches V1 9-10.C.3.3a on informal inference."},{"id":"9-10.C.4.2a","band":"9-10","concept":"C.4.2","text":"Argue why the central question of formal inference is whether an observed difference reflects a real pattern or is within the range of normal variation, and explain why such a judgment is rarely clear-cut and always involves uncertainty.","change":"Revised","from":["6-8.D.3.1a"],"why":""},{"id":"11-12.C.4.2a","band":"11-12","concept":"C.4.2","text":"Given an observed pattern in a dataset, specify the data conditions (sample composition, measurement approach, time period, or context) that would need to hold for the pattern to describe a different group or setting, and assess whether the current data meets those conditions.","change":"Unchanged","from":["9-10.C.3.3a"],"why":""},{"id":"K-2.D.1.1a","band":"K-2","concept":"D.1.1","text":"Experience simple models by sorting objects into groups and by guessing what comes next in a pattern, noticing that a model uses what we know to make a guess about what we don't.","change":"Unchanged","from":["C.5.1"],"why":"Sorting and pattern continuation as early modeling matches V1 K-2.C.5.1a to c."},{"id":"K-2.D.1.1b","band":"K-2","concept":"D.1.1","text":"Notice that we can make different kinds of guesses from data by putting things in groups, guessing a number, or continuing a pattern.","change":"Unchanged","from":["C.5.1"],"why":"Different kinds of guesses from data is V1 understanding modeling at K-2."},{"id":"K-2.D.1.1c","band":"K-2","concept":"D.1.1","text":"Recognize that a model is a way to make a systematic guess, and understand it won't always be right.","change":"Unchanged","from":["C.5.1"],"why":"A model as a systematic guess that can be wrong is V1 understanding modeling."},{"id":"3-5.D.1.1a","band":"3-5","concept":"D.1.1","text":"Distinguish the three things models do - put a case into a category (classification), estimate a number (regression), and continue or complete a pattern (pattern emulation) - and, given a goal, identify which is needed.","change":"Unchanged","from":["K-2.C.5.1a","K-2.C.5.1b","K-2.C.5.1c"],"why":""},{"id":"6-8.D.1.1a","band":"6-8","concept":"D.1.1","text":"Define a model as a representation of a relationship or pattern used to predict, classify, or generate new instances, not a visualization or summary of data you already have.","change":"Revised","from":["K-2.C.5.1c"],"why":""},{"id":"6-8.D.1.1b","band":"6-8","concept":"D.1.1","text":"Given a goal, identify which of the three kinds of model fits, and name an example of each and the question it helps answer.","change":"Revised","from":["6-8.C.5.1b"],"why":""},{"id":"6-8.D.1.1c","band":"6-8","concept":"D.1.1","text":"Explain that a model is a simplification that deliberately leaves things out, and describe what a given model leaves out and why.","change":"Revised","from":["3-5.C.5.1a"],"why":""},{"id":"9-10.D.1.1a","band":"9-10","concept":"D.1.1","text":"Choose among classification, regression, and pattern-emulation models based on the goal, the outcome type (category, value, or new instance), and the available data, and explain why a type does or doesn't fit.","change":"Unchanged","from":["6-8.C.5.1a","6-8.C.5.1b"],"why":""},{"id":"9-10.D.1.1b","band":"9-10","concept":"D.1.1","text":"Identify what a specific model leaves out and explain who might be affected by those omissions.","change":"Revised","from":["6-8.C.5.2a"],"why":""},{"id":"11-12.D.1.1a","band":"11-12","concept":"D.1.1","text":"Evaluate trade-offs among model types for a complex problem (data structure, interpretability, purpose) and recognize when a problem needs a combination of models or none at all.","change":"Unchanged","from":["6-8.C.5.1b"],"why":""},{"id":"K-2.D.1.2a","band":"K-2","concept":"D.1.2","text":"Sort cases into groups with a simple rule based on an attribute and predict a new case's group.","change":"Unchanged","from":["11-12.C.5.1c","6-8.C.5.1b"],"why":""},{"id":"K-2.D.1.2b","band":"K-2","concept":"D.1.2","text":"Notice that when one thing changes another often changes with it, and use that to guess a value.","change":"Unchanged","from":["11-12.C.5.1a"],"why":""},{"id":"K-2.D.1.2c","band":"K-2","concept":"D.1.2","text":"Observe a model that continues a pattern (a tool that finishes a word or guesses the next shape) and recognize it learned the pattern from examples.","change":"Unchanged","from":["C.2.5","C.5.2"],"why":"A tool that learned a pattern from examples is V1 machine learning at K-2."},{"id":"3-5.D.1.2a","band":"3-5","concept":"D.1.2","text":"Create and apply a simple classification rule to label new cases and notice when it misclassifies.","change":"Unchanged","from":["K-2.C.5.2a","K-2.C.5.2b"],"why":""},{"id":"3-5.D.1.2b","band":"3-5","concept":"D.1.2","text":"Predict a value by extending a trend on a line graph.","change":"Revised","from":["C.5.2","C.2.3"],"why":"Extending a trend to predict joins creating models to defining relationships."},{"id":"3-5.D.1.2c","band":"3-5","concept":"D.1.2","text":"Recognize that pattern-completing models learn from many examples and imitate the pattern, so the examples they see shape what they make.","change":"Unchanged","from":["3-5.A.1.5a"],"why":""},{"id":"6-8.D.1.2a","band":"6-8","concept":"D.1.2","text":"Build a simple classification model from data (e.g., a decision tree by hand) and check how often it is correct.","change":"Unchanged","from":["3-5.C.5.2a"],"why":""},{"id":"6-8.D.1.2b","band":"6-8","concept":"D.1.2","text":"Fit a line to two-variable data to predict a numeric outcome and notice how far predictions fall from actual values (residuals).","change":"Unchanged","from":["C.2.3","C.5.2"],"why":"Fitting a line and noticing residuals matches V1 6-8.C.2.3b and creating models."},{"id":"6-8.D.1.2c","band":"6-8","concept":"D.1.2","text":"Explore how a pattern-completion model (e.g., a text or image generator) is trained on examples and produces new outputs resembling them, and identify how examples (which are necessarily limited) limit the range of outputs.","change":"Unchanged","from":["3-5.A.1.5a"],"why":""},{"id":"9-10.D.1.2a","band":"9-10","concept":"D.1.2","text":"Construct and refine classification models using a computer-based tool, evaluated with accuracy and related measures.","change":"Unchanged","from":["6-8.C.2.5a","6-8.C.5.2a"],"why":""},{"id":"9-10.D.1.2b","band":"9-10","concept":"D.1.2","text":"Construct linear and non-linear regression models using a computer-based tool, interpret parameters, and quantify residuals and sum of squared residuals.","change":"Revised","from":["6-8.C.5.2b","6-8.C.5.2c"],"why":""},{"id":"9-10.D.1.2c","band":"9-10","concept":"D.1.2","text":"Describe how a pattern-completion model represents patterns learned from training data to generate or complete new instances, and examine how the training data influences the results.","change":"Unchanged","from":["6-8.A.1.5a"],"why":""},{"id":"11-12.D.1.2a","band":"11-12","concept":"D.1.2","text":"Build multi-feature classification models using a computer-based tool and examine how they draw decision boundaries.","change":"Unchanged","from":["9-10.C.2.5a","9-10.C.5.2a"],"why":""},{"id":"11-12.D.1.2b","band":"11-12","concept":"D.1.2","text":"Build multiple-regression models with several predictors using a computer-based tool, consider interactions, and evaluate fit and overfitting.","change":"Unchanged","from":["9-10.C.5.2a","9-10.C.5.2b","9-10.C.5.2c"],"why":""},{"id":"11-12.D.1.2c","band":"11-12","concept":"D.1.2","text":"Compare pattern-completion models with classification and regression - recognizing they reproduce the distribution of patterns in data rather than predict a single labeled outcome.","change":"Unchanged","from":["9-10.A.1.5a"],"why":""},{"id":"K-2.D.1.3a","band":"K-2","concept":"D.1.3","text":"Before using a model or pattern to make a prediction, state how confident you are using words like always, sometimes, likely, unlikely, and never. After seeing the result, describe whether your prediction was supported and whether you should have been more or less confident.","change":"Revised","from":["11-12.C.5.2a","11-12.C.5.2b","11-12.C.5.2c"],"why":""},{"id":"3-5.D.1.3a","band":"3-5","concept":"D.1.3","text":"Recognize that a distribution shows how often each outcome has occurred in past data, and use that pattern to say how likely each outcome is in a new prediction.","change":"Unchanged","from":["11-12.A.1.5a"],"why":""},{"id":"3-5.D.1.3b","band":"3-5","concept":"D.1.3","text":"Attach a confidence level to a prediction, using words like certain, likely, unlikely, or impossible, and explain what about the data or model makes you more or less confident.","change":"Unchanged","from":["D.1.1"],"why":"Certain, likely, unlikely, impossible is V1 probabilistic language."},{"id":"6-8.D.1.3a","band":"6-8","concept":"D.1.3","text":"Read a distribution to identify which outcomes a model predicts as most and least likely, and use that information to attach a probability to a specific prediction.","change":"Unchanged","from":["K-2.D.1.2a"],"why":""},{"id":"6-8.D.1.3b","band":"6-8","concept":"D.1.3","text":"Use probability to describe how confident you are in a model's prediction (e.g., a 70% chance vs. a 20% chance), and explain what that uncertainty implies for decisions based on the prediction.","change":"Revised","from":["3-5.C.2.2a"],"why":""},{"id":"6-8.D.1.3c","band":"6-8","concept":"D.1.3","text":"Recognize that a model's prediction is a current best estimate with associated uncertainty, and that both the prediction and the uncertainty level should update when new data arrives, treating revision as a sign that the model is working, not failing.","change":"Revised","from":["3-5.D.1.1a"],"why":""},{"id":"9-10.D.1.3a","band":"9-10","concept":"D.1.3","text":"Describe probability distributions as models of how likely different prediction outcomes are, and give real-world examples of situations where each type of distribution would be an appropriate model for uncertainty.","change":"Unchanged","from":["D.1.4","D.1.5"],"why":"Probability distributions as models matches V1 9-10.D.1.4b."},{"id":"9-10.D.1.3b","band":"9-10","concept":"D.1.3","text":"Use a probability model to quantify how likely a prediction's outcome is, and distinguish uncertainty that comes from randomness in the outcome from uncertainty that comes from the model being imperfect.","change":"Revised","from":["6-8.D.1.5d"],"why":""},{"id":"9-10.D.1.3c","band":"9-10","concept":"D.1.3","text":"Explain how the uncertainty in a model's predictions should update when new evidence arrives (where stronger or more surprising evidence produces larger updates, and weaker evidence from a small sample produces smaller ones) so that predictions carry forward the accumulated weight of all evidence seen so far.","change":"Unchanged","from":["6-8.D.1.2a","6-8.D.1.2b"],"why":""},{"id":"11-12.D.1.3a","band":"11-12","concept":"D.1.3","text":"Interpret the variability in a sampling distribution as a quantified measure of prediction uncertainty, explaining how wider spread means less precise estimates, and use that variability to bound a prediction about a population parameter.","change":"Unchanged","from":["9-10.D.1.4b"],"why":""},{"id":"11-12.D.1.3b","band":"11-12","concept":"D.1.3","text":"Explain the logic of updating a model's predictions with new evidence: a prior estimate of likelihood, combined with the strength of new data, produces a revised prediction. Recognize this as the underlying structure of Bayesian reasoning and how scientific consensus accumulates over time.","change":"Revised","from":["9-10.D.1.5a"],"why":""},{"id":"3-5.D.2.1a","band":"3-5","concept":"D.2.1","text":"Use a simple model or pattern in one situation to predict what might happen in a new situation.","change":"Unchanged","from":["11-12.D.1.2a","11-12.D.1.2b","11-12.D.1.2c"],"why":""},{"id":"3-5.D.2.1b","band":"3-5","concept":"D.2.1","text":"Recognize that predictions can be more or less certain depending on similarity to the original data.","change":"Unchanged","from":["D.3.1"],"why":"Prediction certainty depending on similarity to the original data is V1 application fitness."},{"id":"6-8.D.2.1a","band":"6-8","concept":"D.2.1","text":"Use models to make predictions and compare predicted values to actual observed values.","change":"Unchanged","from":["K-2.D.3.1a"],"why":""},{"id":"6-8.D.2.1b","band":"6-8","concept":"D.2.1","text":"Identify factors that make predictions more or less reliable.","change":"Unchanged","from":["3-5.D.3.1a"],"why":""},{"id":"9-10.D.2.1a","band":"9-10","concept":"D.2.1","text":"Use computer-based tools to make predictions from models and visualize prediction uncertainty.","change":"Revised","from":["C.4.1","C.5.2"],"why":"Using a digital tool to predict and visualize uncertainty is V1 tool application."},{"id":"9-10.D.2.1b","band":"9-10","concept":"D.2.1","text":"Generate point predictions and prediction intervals to communicate expected outcomes and plausible ranges.","change":"Unchanged","from":["6-8.D.5.2c"],"why":"Point predictions and prediction intervals match V1 11-12.C.2.3b. Replaces an unresolvable reference to \"D.5.2\" in the workbook."},{"id":"9-10.D.2.1c","band":"9-10","concept":"D.2.1","text":"Use expected-value calculations to compare scenarios with repeated or uncertain outcomes.","change":"Unchanged","from":["D.1.3"],"why":"Expected-value comparison is V1 expected value."},{"id":"11-12.D.2.1a","band":"11-12","concept":"D.2.1","text":"Construct prediction intervals for individual observations and communicate the practical implications of the interval's width to a non-technical audience.","change":"Revised","from":["9-10.C.5.2b"],"why":""},{"id":"11-12.D.2.1b","band":"11-12","concept":"D.2.1","text":"Build and evaluate expected-value models that account for multiple scenarios with different probabilities, and use them to inform a real decision or policy recommendation.","change":"Revised","from":["11-12.C.2.3b"],"why":""},{"id":"K-2.D.2.2a","band":"K-2","concept":"D.2.2","text":"Describe characteristics of a population and recognize that variability exists.","change":"Unchanged","from":["11-12.C.2.3b"],"why":""},{"id":"3-5.D.2.2a","band":"3-5","concept":"D.2.2","text":"Repeat a small survey or sample and notice that results differ from one sample to the next.","change":"Revised","from":["11-12.B.4.2a"],"why":""},{"id":"6-8.D.2.2a","band":"6-8","concept":"D.2.2","text":"Evaluate whether a sample is representative enough to draw conclusions about a larger population, and generate multiple samples (or simulated samples) of the same size to describe how much estimates vary","change":"Revised","from":["D.1.5","D.3.2"],"why":"Repeated or simulated samples to test representativeness joins sampling and simulation to sample versus population."},{"id":"9-10.D.2.2a","band":"9-10","concept":"D.2.2","text":"Use simulations to determine whether results are likely due to something other than random chance, and answer probabilistic questions from them.","change":"Unchanged","from":["K-2.D.1.5a"],"why":""},{"id":"11-12.D.2.2a","band":"11-12","concept":"D.2.2","text":"Use simulation-based inferential methods to draw conclusions about a population from a sample.","change":"Revised","from":["3-5.D.1.5a","3-5.D.1.5b"],"why":""},{"id":"11-12.D.2.2b","band":"11-12","concept":"D.2.2","text":"Estimate confidence intervals and p-values from simulations and interpret them in context.","change":"Revised","from":["6-8.D.1.5a","6-8.D.3.2a"],"why":""},{"id":"K-2.D.3.1a","band":"K-2","concept":"D.3.1","text":"Compare two simple sorting rules or predictions to see which works better and explain why.","change":"Unchanged","from":["11-12.D.1.5c"],"why":""},{"id":"3-5.D.3.1a","band":"3-5","concept":"D.3.1","text":"Compare predictions from two different models applied to the same dataset to determine which is more accurate.","change":"Unchanged","from":["C.5.2"],"why":"Comparing two models on the same data matches V1 6-8.C.5.2c."},{"id":"3-5.D.3.1b","band":"3-5","concept":"D.3.1","text":"Test whether a pattern or rule works by checking it against a new subset of data and revise when it makes mistakes.","change":"Unchanged","from":["C.5.2","D.2.2"],"why":"Testing a rule on new data and revising joins creating models to iteration and validation."},{"id":"6-8.D.3.1a","band":"6-8","concept":"D.3.1","text":"Calculate how often a model makes correct predictions (accuracy) and use it to choose between classification models built from the same data.","change":"Unchanged","from":["C.2.5","C.5.2"],"why":"Accuracy to choose between classifiers joins machine learning to creating models."},{"id":"6-8.D.3.1b","band":"6-8","concept":"D.3.1","text":"Test a model on new data that wasn't used to build it.","change":"Unchanged","from":["C.5.2"],"why":"Holding out new data to test a model is V1 creating models."},{"id":"9-10.D.3.1a","band":"9-10","concept":"D.3.1","text":"Identify ways to measure model fit (mean squared error or mean absolute error for quantitative; accuracy for classification).","change":"Unchanged","from":["C.3.3","C.5.2"],"why":"Error measures match V1 11-12.C.3.3a on errors between predictions and outcomes."},{"id":"9-10.D.3.1b","band":"9-10","concept":"D.3.1","text":"Use multiple error metrics (precision, recall, F1) to evaluate and compare classification models; apply cross-validation to avoid overfitting.","change":"Unchanged","from":["9-10.C.2.5a"],"why":""},{"id":"9-10.D.3.1c","band":"9-10","concept":"D.3.1","text":"Examine residuals (the gaps between predictions and actual values) to judge whether a model fits well or systematically misses, and where it misses.","change":"Unchanged","from":["9-10.C.5.2c"],"why":""},{"id":"11-12.D.3.1a","band":"11-12","concept":"D.3.1","text":"Compare competing regression or classification models for the same task using appropriate error metrics and a held-out dataset, and justify the choice of one model over another.","change":"Revised","from":["9-10.C.5.2c"],"why":""},{"id":"11-12.D.3.1b","band":"11-12","concept":"D.3.1","text":"Diagnose a model's weaknesses using residual plots (for regression) and confusion matrices (for classification).","change":"Revised","from":["C.3.3"],"why":"Matches V1 11-12.C.3.3b naming residual plots and confusion matrices."},{"id":"11-12.D.3.1c","band":"11-12","concept":"D.3.1","text":"Explain the bias-variance trade-off and distinguish underfitting from overfitting and weigh a model's predictive power against how interpretable or explainable it is for a given purpose.","change":"Revised","from":["11-12.C.3.3a","11-12.C.3.3b"],"why":""},{"id":"11-12.D.3.1d","band":"11-12","concept":"D.3.1","text":"Recognize that a model that fits the data well may still misrepresent how the system actually works, and weigh how well competing models reflect the real structure of the problem, not just their error.","change":"Unchanged","from":["C.5.1","D.3.1"],"why":"A well-fitting but misleading model joins understanding modeling to application fitness."},{"id":"11-12.D.3.1e","band":"11-12","concept":"D.3.1","text":"Evaluate a classification model for algorithmic bias (whether it performs unequally across groups).","change":"Added","from":["6-8.C.5.1b"],"why":""},{"id":"6-8.D.3.2a","band":"6-8","concept":"D.3.2","text":"Assess simple data to identify potential associations while recognizing that correlation does not imply causation.","change":"Unchanged","from":["D.1.6"],"why":"Matches V1 6-8.D.1.6a on associations without causation."},{"id":"6-8.D.3.2b","band":"6-8","concept":"D.3.2","text":"Identify and categorize the explanatory and response variables in a relationship between numerical variables.","change":"Revised","from":["D.1.6"],"why":"Matches V1 6-8.D.1.6b on independent, dependent, and covariate terms."},{"id":"9-10.D.3.2a","band":"9-10","concept":"D.3.2","text":"Identify spurious correlations and explore other potential causes.","change":"Revised","from":["3-5.D.1.6a"],"why":""},{"id":"11-12.D.3.2a","band":"11-12","concept":"D.3.2","text":"Identify cases where two variables are both driven by a third, and analyze how such spurious correlations feed misleading claims and AI recommendations.","change":"Unchanged","from":["6-8.D.1.6a"],"why":""},{"id":"3-5.D.3.3a","band":"3-5","concept":"D.3.3","text":"Revise a model or its predictions when new data suggest findings don't hold.","change":"Revised","from":["9-10.D.1.6b"],"why":""},{"id":"6-8.D.3.3a","band":"6-8","concept":"D.3.3","text":"Identify factors that limit how broadly findings can be applied.","change":"Unchanged","from":["11-12.D.1.6b"],"why":""},{"id":"6-8.D.3.3b","band":"6-8","concept":"D.3.3","text":"Revise assumptions or modeling choices when new data suggest findings don't generalize as expected.","change":"Unchanged","from":["3-5.D.3.1a"],"why":""},{"id":"9-10.D.3.3a","band":"9-10","concept":"D.3.3","text":"Evaluate how sampling methods and study design determine which populations and contexts a model's conclusions can extend to.","change":"Unchanged","from":["3-5.A.3.2a"],"why":""},{"id":"9-10.D.3.3b","band":"9-10","concept":"D.3.3","text":"Use a computer-based tool to systematically test model variations and compare performance to select the best approach.","change":"Unchanged","from":["6-8.D.3.1a"],"why":""},{"id":"11-12.D.3.3a","band":"11-12","concept":"D.3.3","text":"Evaluate whether a model or finding built in one context holds in another (population, context, or time period), testing by applying it to independent datasets, subsets of the dataset, or by replicating.","change":"Unchanged","from":["6-8.A.3.2a"],"why":""},{"id":"K-2.E.1.1a","band":"K-2","concept":"E.1.1","text":"Explain what a pattern in data tells us about the real world, while recognizing the pattern might not always hold.","change":"Revised","from":["A.3.4","D.2.4"],"why":"What a pattern says about the world, and its limits, joins apply context to relevant conclusions."},{"id":"3-5.E.1.1a","band":"3-5","concept":"E.1.1","text":"Describe what trends in graphs mean in terms of the things being measured, using everyday language.","change":"Revised","from":["E.1.4","D.2.4"],"why":"Translating a trend into the things measured joins graphical literacy to relevant conclusions."},{"id":"3-5.E.1.1b","band":"3-5","concept":"E.1.1","text":"Generate a simple observation about what the data shows and describe what it might mean beyond the data collected.","change":"Revised","from":["K-2.D.2.4a"],"why":""},{"id":"6-8.E.1.1a","band":"6-8","concept":"E.1.1","text":"Generate a statement that answers the investigation question directly and provides relevant data to support the conclusion.","change":"Unchanged","from":["3-5.D.2.4a","3-5.D.2.4b"],"why":""},{"id":"6-8.E.1.1b","band":"6-8","concept":"E.1.1","text":"Interpret the meaning of the y-intercept and slope of a relationship in context and determine whether they make sense in context.","change":"Unchanged","from":["D.1.8"],"why":"Interpreting slope and intercept in context matches V1 6-8.D.1.8c."},{"id":"9-10.E.1.1a","band":"9-10","concept":"E.1.1","text":"Formulate statements based on evidence that address the question, incorporate relevant statistics, and interpret what results signify in practice.","change":"Unchanged","from":["D.2.4"],"why":"Matches V1 9-10.D.2.4a on statements that address the original question."},{"id":"9-10.E.1.1b","band":"9-10","concept":"E.1.1","text":"Translate regression model outputs into plain-language explanations for non-technical audiences.","change":"Revised","from":["6-8.D.2.4a"],"why":""},{"id":"11-12.E.1.1a","band":"11-12","concept":"E.1.1","text":"Interpret and critically evaluate multiple-regression coefficients, each reflecting a predictor's relationship holding others constant, weighing practical significance, model appropriateness, and alternative explanations.","change":"Revised","from":["D.1.8"],"why":"Regression coefficients holding others constant matches V1 11-12.D.1.8b."},{"id":"K-2.E.1.2a","band":"K-2","concept":"E.1.2","text":"Describe what a data finding says about a real-world situation in plain language, and recognize the difference between what the data shows and what you are still unsure about.","change":"Unchanged","from":["D.2.4","A.1.4"],"why":"Separating what data shows from what you believe joins relevant conclusions to partial information."},{"id":"3-5.E.1.2a","band":"3-5","concept":"E.1.2","text":"Describe in plain language what a result means, whether it is surprising given what you expected, and what that surprise (or lack of it) implies for the question being investigated.","change":"Unchanged","from":["D.1.2"],"why":"Whether a result is surprising given expectations is V1 priors and updates."},{"id":"3-5.E.1.2b","band":"3-5","concept":"E.1.2","text":"State whether a conclusion from data is well-supported or uncertain, identifying the specific limitations such as small sample, missing groups, or narrow context that weaken it.","change":"Unchanged","from":["D.2.3"],"why":"Naming limitations such as a small sample is V1 uncertainty statements and limitations."},{"id":"3-5.E.1.2c","band":"3-5","concept":"E.1.2","text":"Describe whether a data finding matters in real life, not just whether it shows a pattern because a result can be true and still be too small to care about.","change":"Unchanged","from":["D.1.4"],"why":"A true but too-small-to-matter result is V1 explaining significance, effect size against significance."},{"id":"6-8.E.1.2a","band":"6-8","concept":"E.1.2","text":"When stating a conclusion, communicate its uncertainty explicitly by describing what the data supports, what it cannot support, and what would need to be true for the conclusion to extend further.","change":"Revised","from":["K-2.E.3.2a"],"why":""},{"id":"6-8.E.1.2b","band":"6-8","concept":"E.1.2","text":"Distinguish between a finding that is real or unusual in the data and one that is large or meaningful enough to matter in practice.","change":"Revised","from":["3-5.D.1.4a"],"why":""},{"id":"9-10.E.1.2a","band":"9-10","concept":"E.1.2","text":"Characterize a finding by stating both its statistical meaning (whether it is likely due to chance) and its practical meaning (whether the effect is large enough to matter in context), because a result can be statistically real and still be too small to act on.","change":"Unchanged","from":["3-5.D.2.3a"],"why":""},{"id":"9-10.E.1.2b","band":"9-10","concept":"E.1.2","text":"State how a claim would change if the data were disaggregated into subgroups reflecting that conclusions may not be the same across subpopulations.","change":"Unchanged","from":["6-8.D.2.4b"],"why":""},{"id":"11-12.E.1.2a","band":"11-12","concept":"E.1.2","text":"Explain statistical significance and effect size in plain language, describe their limitations, and select the most appropriate measure for a given context.","change":"Revised","from":["6-8.D.1.1a"],"why":""},{"id":"11-12.E.1.2b","band":"11-12","concept":"E.1.2","text":"Frame findings to show how the same data may have different implications for different stakeholder groups, without misrepresenting evidence.","change":"Unchanged","from":["A.3.4","E.2.3"],"why":"Different implications for different stakeholders joins apply context to adapt storytelling."},{"id":"K-2.E.1.3a","band":"K-2","concept":"E.1.3","text":"Notice that people often use patterns to make claims, and that those claims should be checked before we believe them.","change":"Revised","from":["A.1.4","E.3.1"],"why":"Claims from patterns needing checking joins partial information to intent and authorship."},{"id":"3-5.E.1.3a","band":"3-5","concept":"E.1.3","text":"Recognize that data-based claims can reach beyond the data collected, that those claims should acknowledge what we don't yet know, and begin to describe what we are unsure of.","change":"Unchanged","from":["11-12.D.1.4a","11-12.D.1.4b","11-12.D.1.4c","11-12.D.1.4d"],"why":""},{"id":"6-8.E.1.3a","band":"6-8","concept":"E.1.3","text":"Communicate a conclusion that reaches beyond the immediate dataset while acknowledging its uncertainty - an informal inference.","change":"Unchanged","from":["D.2.3","D.3.5"],"why":"Informal inference beyond the dataset joins uncertainty statements to extension statements."},{"id":"6-8.E.1.3b","band":"6-8","concept":"E.1.3","text":"Notice when a claim about data seems exaggerated or leaves out information that would change how it is understood, and describe what is missing.","change":"Unchanged","from":["E.3.1","D.2.3"],"why":"Spotting an exaggerated or incomplete claim is V1 intent and authorship of analyses."},{"id":"9-10.E.1.3a","band":"9-10","concept":"E.1.3","text":"Identify false, misleading, or erroneous claims in others' work and explain what the data does and does not actually support.","change":"Unchanged","from":["K-2.D.3.1a"],"why":""},{"id":"11-12.E.1.3a","band":"11-12","concept":"E.1.3","text":"Construct a complete, well-supported argument from data (by integrating statistical evidence, acknowledging limitations, and providing contextual interpretation) that makes a specific claim and anticipates counterarguments.","change":"Unchanged","from":["3-5.E.2.2a"],"why":""},{"id":"11-12.E.1.3b","band":"11-12","concept":"E.1.3","text":"Acknowledge explicitly, when stating a claim, what new evidence would change it and how, communicating that the claim is a current best interpretation, not a permanent conclusion.","change":"Revised","from":["6-8.D.1.8a","6-8.D.1.8c"],"why":""},{"id":"K-2.E.2.1a","band":"K-2","concept":"E.2.1","text":"When sharing a data finding with others, use words like always, sometimes, and never to communicate how certain you are so that the listener knows how much to rely on it.","change":"Unchanged","from":["11-12.D.1.8a","11-12.D.1.8b"],"why":""},{"id":"K-2.E.2.1b","band":"K-2","concept":"E.2.1","text":"Use data to tell a simple story with a beginning (question), middle (what we found), and end (what it means).","change":"Unchanged","from":["11-12.D.1.8c","11-12.D.1.8d"],"why":""},{"id":"3-5.E.2.1a","band":"3-5","concept":"E.2.1","text":"When sharing a conclusion with others, use informal language such as I think, I'm pretty sure, I'm not certain to signal your confidence level, so the audience understands how strongly the data supports it.","change":"Unchanged","from":["D.1.1"],"why":"Signalling confidence informally is V1 probabilistic language."},{"id":"3-5.E.2.1b","band":"3-5","concept":"E.2.1","text":"Describe data clearly using comparative terms (most, least, greater than, less than) and by identifying trends or patterns.","change":"Unchanged","from":["E.2.2"],"why":"Matches V1 3-5.E.2.2a on most, least, greater than, less than."},{"id":"6-8.E.2.1a","band":"6-8","concept":"E.2.1","text":"State a finding to an audience alongside an honest confidence level, explaining what makes you more or less certain and avoiding language that overstates how much the data supports the conclusion.","change":"Unchanged","from":["K-2.D.1.1a"],"why":""},{"id":"6-8.E.2.1b","band":"6-8","concept":"E.2.1","text":"Support a data-based claim with specific numbers (values, percentages, or ranges) and describe how certain or uncertain those numbers make the conclusion.","change":"Unchanged","from":["K-2.E.2.2a"],"why":""},{"id":"9-10.E.2.1a","band":"9-10","concept":"E.2.1","text":"Evaluate how data supports or contradicts claims while being open about limitations and communicate the likelihood or confidence behind a claim rather than presenting it as settled.","change":"Unchanged","from":["3-5.D.1.1a"],"why":""},{"id":"9-10.E.2.1b","band":"9-10","concept":"E.2.1","text":"Communicate a claim or prediction to an audience by stating the assumptions behind it, quantifying its uncertainty in terms the audience can use, and acknowledging the limitations that prevent a stronger conclusion so that the audience can judge how much to rely on it.","change":"Unchanged","from":["3-5.E.2.2a"],"why":""},{"id":"9-10.E.2.1c","band":"9-10","concept":"E.2.1","text":"Support claims by citing sources and research representing multiple perspectives.","change":"Unchanged","from":["6-8.D.1.1a"],"why":""},{"id":"11-12.E.2.1a","band":"11-12","concept":"E.2.1","text":"Define claims specifically and measurably, and verify the data directly addresses them.","change":"Revised","from":["E.2.2","D.2.4"],"why":"Matches V1 11-12.E.2.2b and 11-12.E.2.2c on specific, measurable claims the data addresses."},{"id":"11-12.E.2.1b","band":"11-12","concept":"E.2.1","text":"Distinguish between data narratives that accurately represent evidence and those that selectively frame or omit it to mislead, and commit to only presenting data in ways that a reasonable reader would recognize as fair.","change":"Unchanged","from":["9-10.D.1.1a","9-10.E.2.2a"],"why":""},{"id":"K-2.E.2.2a","band":"K-2","concept":"E.2.2","text":"Tell a simple story about what data or a visualization shows.","change":"Unchanged","from":["9-10.E.2.2b"],"why":""},{"id":"K-2.E.2.2b","band":"K-2","concept":"E.2.2","text":"Identify and describe the parts of graphs (titles, labels, legends, colors) and explain what each part helps the reader understand.","change":"Revised","from":["11-12.D.1.1a"],"why":""},{"id":"3-5.E.2.2a","band":"3-5","concept":"E.2.2","text":"Adapt storytelling to suit different audiences and generate interest with hooks supported by data.","change":"Unchanged","from":["E.2.3","E.2.2"],"why":"Adapting a story to an audience with a hook joins adapt storytelling to write data stories."},{"id":"3-5.E.2.2b","band":"3-5","concept":"E.2.2","text":"Create visualizations to summarize data and highlight the information that supports a claim (e.g., with color, labels, or annotations).","change":"Unchanged","from":["E.1.2","E.1.1"],"why":"Visualizing to support a claim joins investigate with visualizations to sense-making."},{"id":"6-8.E.2.2a","band":"6-8","concept":"E.2.2","text":"Give context to findings by connecting numbers to concrete stories or examples.","change":"Unchanged","from":["K-2.E.2.3a"],"why":""},{"id":"6-8.E.2.2b","band":"6-8","concept":"E.2.2","text":"Create multi-variable visualizations for an intended audience, with clear labels (data, unit, source) so a reader can interpret the visualization without additional explanation.","change":"Unchanged","from":["K-2.E.1.1b","K-2.E.1.3a"],"why":""},{"id":"6-8.E.2.2c","band":"6-8","concept":"E.2.2","text":"Compare two design versions of the same visualization and justify which better serves the audience and purpose.","change":"Unchanged","from":["3-5.E.2.2c","3-5.E.2.3a"],"why":""},{"id":"6-8.E.2.2d","band":"6-8","concept":"E.2.2","text":"Present data using appropriate tools in ways that are accessible and easy to read for specific audiences (e.g., using colors and labels that everyone can see).","change":"Revised","from":["3-5.E.1.5a"],"why":""},{"id":"9-10.E.2.2a","band":"9-10","concept":"E.2.2","text":"Use analogies or relatable comparisons to make findings accessible while maintaining accuracy.","change":"Unchanged","from":["6-8.E.2.3b"],"why":""},{"id":"9-10.E.2.2b","band":"9-10","concept":"E.2.2","text":"Design and edit visualizations using computer-based tools with deliberate choices about scale, color, format, and clutter to emphasize key findings, including accessible formats (e.g., colorblind-friendly palettes) suited to the audience's needs and goals.","change":"Revised","from":["6-8.E.1.1a","6-8.E.1.3a"],"why":""},{"id":"11-12.E.2.2a","band":"11-12","concept":"E.2.2","text":"Craft narratives that integrate multiple data sources into a coherent, compelling, data-based story.","change":"Unchanged","from":["E.2.2"],"why":"Integrating multiple sources into one narrative is V1 write data stories."},{"id":"11-12.E.2.2b","band":"11-12","concept":"E.2.2","text":"Make and defend arguments using key features from visualizations to inform a decision or advocate for a course of action.","change":"Unchanged","from":["6-8.E.2.3a"],"why":""},{"id":"11-12.E.2.2c","band":"11-12","concept":"E.2.2","text":"Compare visualization approaches and justify choices based on both audience goals and analytical purpose.","change":"Unchanged","from":["E.1.5","E.1.6"],"why":"Comparing and justifying visualization approaches joins representational fluency to visual-type matching."},{"id":"K-2.E.2.3a","band":"K-2","concept":"E.2.3","text":"Recount what you did during a data activity so someone else could try the same steps.","change":"Unchanged","from":["A.3.1","D.3.7"],"why":"Recounting steps so others can repeat them joins the investigative process to reproducible documentation."},{"id":"3-5.E.2.3a","band":"3-5","concept":"E.2.3","text":"Document the steps of an investigation clearly enough that another person could repeat the process and check results.","change":"Unchanged","from":["11-12.E.2.2a"],"why":""},{"id":"6-8.E.2.3a","band":"6-8","concept":"E.2.3","text":"Record collection and analysis decisions (tools used, choices made, changes) so the work can be understood and verified.","change":"Unchanged","from":["11-12.E.1.1b","11-12.E.1.3a"],"why":""},{"id":"9-10.E.2.3a","band":"9-10","concept":"E.2.3","text":"Document analytical choices throughout an investigation so that others can evaluate and reproduce the findings.","change":"Revised","from":["D.3.7"],"why":"Matches V1 9-10.D.3.7b on documenting analysis in a shareable, reproducible format."},{"id":"9-10.E.2.3b","band":"9-10","concept":"E.2.3","text":"Explain why automating data investigation steps using code or a low-code tool improves reproducibility and transparency, and identify which steps in a given investigation would benefit most from automation.","change":"Unchanged","from":["C.4.5"],"why":"Automation improving reproducibility is V1 the role of code in data analysis."},{"id":"11-12.E.2.3a","band":"11-12","concept":"E.2.3","text":"Create documentation (embedded in code comments, low-code tool notes, or a separate datasheet) recording data sources, cleaning steps, analytical decisions, and tools in enough detail for full reproduction; and expect this documentation when using datasets created by others, especially large or secondary datasets.","change":"Unchanged","from":["D.3.7","C.1.6"],"why":"A datasheet recording sources and cleaning steps joins reproducible documentation to metadata."},{"id":"11-12.E.2.3b","band":"11-12","concept":"E.2.3","text":"Justify the choice of computer-based tool (no-code, low-code, or code-based) for visualization, summarization, and modeling tasks, explaining what the chosen tool enables and what it constrains.","change":"Unchanged","from":["9-10.D.3.7b"],"why":""},{"id":"K-2.E.2.4a","band":"K-2","concept":"E.2.4","text":"Read a simple picture graph or bar graph and say what each part tells you.","change":"Revised","from":["9-10.C.4.5a","9-10.C.4.5b"],"why":""},{"id":"K-2.E.2.4b","band":"K-2","concept":"E.2.4","text":"Recognize that different ways of showing the same information can make it easier or harder to understand.","change":"Unchanged","from":["11-12.D.3.7b"],"why":""},{"id":"3-5.E.2.4a","band":"3-5","concept":"E.2.4","text":"Interpret common visualizations such as bar graphs, pictographs, pie charts, and simple line graphs by identifying the variable shown and what the graph communicates.","change":"Unchanged","from":["11-12.C.4.5b"],"why":""},{"id":"3-5.E.2.4b","band":"3-5","concept":"E.2.4","text":"Recognize that different graph types represent data differently (e.g., a plot where each bar is one case versus a bar graph where each bar is a category's frequency).","change":"Unchanged","from":["E.1.6","E.1.5"],"why":"Different graph types representing data differently is V1 parallel visual-type construction."},{"id":"3-5.E.2.4c","band":"3-5","concept":"E.2.4","text":"Identify when a visualization or claim leaves out important information that would change how it is understood.","change":"Unchanged","from":["K-2.E.1.4a","K-2.E.1.4b"],"why":""},{"id":"6-8.E.2.4a","band":"6-8","concept":"E.2.4","text":"Interpret visualizations that combine several variables or use less familiar encodings (color, size, position), including multivariable and small-multiple displays (the same graph type repeated side-by-side for different subgroups) by identifying the variables encoded and what the visualization shows.","change":"Unchanged","from":["K-2.E.1.5a"],"why":""},{"id":"6-8.E.2.4b","band":"6-8","concept":"E.2.4","text":"Describe what a visualization emphasizes or hides based on which variables are shown, and how the words in titles, labels, and captions frame the findings.","change":"Unchanged","from":["3-5.E.1.4a","3-5.E.1.4c"],"why":""},{"id":"6-8.E.2.4c","band":"6-8","concept":"E.2.4","text":"Examine whether visualizations and their surrounding text support one another.","change":"Revised","from":["3-5.E.1.6a"],"why":""},{"id":"9-10.E.2.4a","band":"9-10","concept":"E.2.4","text":"Interpret an unfamiliar multivariable graphic, including interactive graphs and dashboards, from media or publications, stating what it shows, how variables are encoded, and what it does and does not support as a conclusion.","change":"Unchanged","from":["3-5.E.1.5a"],"why":""},{"id":"9-10.E.2.4b","band":"9-10","concept":"E.2.4","text":"Distinguish visualization choices that mislead (cherry-picked data, deceptively truncated axes) from legitimate conventions (log scales, intentional zoom), and anticipate how a viewer might misread a representation.","change":"Unchanged","from":["6-8.E.1.4a","6-8.E.1.4c"],"why":""},{"id":"9-10.E.2.4c","band":"9-10","concept":"E.2.4","text":"Compare how the same data is visualized with different features (e.g., color, scale, bin size, or graph type) and explain what each version emphasizes or hides.","change":"Revised","from":["6-8.E.1.5a","6-8.E.1.5b"],"why":""},{"id":"11-12.E.2.4a","band":"11-12","concept":"E.2.4","text":"Make sense of complex multivariable visualizations that use color, size, and 2-D or 3-D space to encode relationships.","change":"Revised","from":["6-8.E.2.1a"],"why":""},{"id":"11-12.E.2.4b","band":"11-12","concept":"E.2.4","text":"Evaluate the cumulative effect of multiple design choices in a visualization such as scale, color, framing, selective evidence, and construct a more accurate alternative, explaining specifically how the original distorted the viewer's understanding.","change":"Unchanged","from":["9-10.E.1.4a"],"why":""}],"v1Strand":{"A":"Dispositions and Responsibility","B":"Creation and Curation","C":"Analysis and Modeling Techniques","D":"Interpreting Problems and Results","E":"Visualization and Communication"},"v2Strand":{"A":{"name":"Foundations of Data","desc":"How the world is represented as data, why that matters, and the dispositions that drive responsible investigation."},"B":{"name":"Creation and Curation","desc":"Understanding how data is created, collected, organized, and prepared for analysis, with attention to measurement, sampling, design, ethics, and data quality"},"C":{"name":"Exploring and Describing Data","desc":"Exploring, visualizing, and summarizing data to see what is typical (signal) and how much it varies (noise), and to begin reasoning about whether a pattern would hold beyond the data at hand."},"D":{"name":"Predicting and Evaluating with Models","desc":"Building, using, and evaluating models to make predictions, reason beyond the data, and weigh the strength of evidence for claims about the world."},"E":{"name":"Interpretation and Communication","desc":"Turning datasets, analysis and models into claims, communicating those claims responsibly and effectively, and using data to inform decisions, while recognizing how communication can inform or mislead."}},"v2Sub":{"A.1":{"name":"The Data-Filled World","desc":"Understanding how the modern world is increasingly represented as data (its forms, its origins, and its capacity to empower and to harm) as the backdrop for investigating questions and making sense of data others have produced."},"A.2":{"name":"Investigative Curiosity and Agency","desc":"Developing the disposition to engage with data as something that shapes one's own life and community as well as the sense that one can question, investigate, and act on data."},"A.3":{"name":"Reasoning About and Evaluating Claims","desc":"Developing the disposition to critically evaluate data-based claims, one's own and others', as an everyday practice, distinguishing evidence from opinion and resisting misleading, false, or unsupported conclusions."},"A.4":{"name":"The Investigative Cycle: Questions, Data, and Iteration","desc":"Understanding the non-linear relationship between questions and data and that questions drive the search for data, data raises new questions, and investigators loop back and revise as evidence emerges."},"B.1":{"name":"Measurement","desc":"Developing skills in defining what to measure and how to measure it because measurement decisions shape the nature and quality of data produced, and errors made here cannot be corrected by better analysis later."},"B.2":{"name":"Sampling and Investigation Design","desc":"Understanding how decisions about who or what to include in a data investigation, and how that investigation is structured, shape the quality and inferential strength of findings because a poorly designed study cannot be rescued by sophisticated analysis."},"B.3":{"name":"Ethics in Data Collection/Production and Use","desc":"Applying ethical principles to the collection, handling, and use of data (including privacy, consent, fairness, and the societal implications of data-driven technologies) because data collection is never neutral and every choice can empower or harm real people."},"B.4":{"name":"Organizing and Processing of Data","desc":"Developing skills to organize, clean, and transform raw data into formats suitable for analysis, because real-world data is almost never ready to use as collected and students who have only worked with pre-cleaned datasets will be unprepared for data they encounter in college, careers, and civic life."},"C.1":{"name":"Exploring Data","desc":"Recognize that the world varies, and that this variability is why data can't be read at a glance, it is how we begin to organize and make sense of it. Living with this variation means getting comfortable reasoning under uncertainty rather than expecting one clean answer."},"C.2":{"name":"Visualizing Data for Analysis","desc":"Developing skills in creating and interpreting visualizations of single and multiple variables across data types (including numerical, categorical, text, image, and geographic data) using analog and computer-based tools as the working medium, to detect signal and noise in an investigation."},"C.3":{"name":"Summarizing Data","desc":"Using summary measures, often computed with computer-based tools, to characterize single-variable distributions and relationships among variables, quantifying signal and noise as a complement to visual exploration."},"C.4":{"name":"Interpreting Variability","desc":"Making sense of why data varies and what that variation implies as well as distinguishing sources of variation and using them to judge whether an observed pattern is signal, noise, or likely to hold beyond the data at hand."},"D.1":{"name":"Building and Selecting Models","desc":"Constructing models that represent relationships, patterns, or processes in data, choosing among them based on the question and the data, and using probability to express the uncertainty they carry."},"D.2":{"name":"Using Models to Predict and Explain","desc":"Applying models to make predictions about cases not yet seen, and to reason about what the data implies for a broader population or process."},"D.3":{"name":"Evaluating and Improving Models","desc":"Judging how well a model fits and predicts, weighing the strength and reach of the evidence it provides, and refining it as new data and evidence arrive."},"E.1":{"name":"Making and Justifying Claims with Data","desc":"Forming claims that are supported by evidence and characterizing them in terms of their strength, significance, and implications for an audience."},"E.2":{"name":"Communicating Responsibly and Effectively","desc":"Conveying findings clearly, accurately, and ethically for a given audience because analysis that cannot be communicated cannot create change, and communication that misleads, even unintentionally, erodes the trust that makes data useful in the first place."}},"v1Sub":{"A.1":"Nature of Data","A.2":"Data Ethics and Responsibilities","A.3":"Investigative Dispositions","B.1":"Organization and Processing","B.2":"Designing for Data Collection","B.3":"Measurement and Datafication","B.4":"Complexity of Data","C.1":"Summarizing Data","C.2":"Identifying Patterns and Relationships","C.3":"Variability in Data","C.4":"Digital Tools of Data Analysis","C.5":"Models of Data","D.1":"Making and Justifying Claims","D.2":"Problem Identification and Question Formation","D.3":"Generalization","E.1":"Representations and Dynamic Visualizations","E.2":"Data Storytelling","E.3":"Acting on Data to Benefit Society"},"orphans":["C.4.6"],"badRefs":[{"s":"D.5.2","t":"D.2.1","ids":["9-10.D.2.1b"]}],"unmapped":[],"stats":{"v1Concepts":83,"v2Concepts":43,"v1Comp":688,"v2Comp":434,"links":192,"mapped":434,"crossStrand":97,"crossStrandComp":205}};
</script>
<script>
/* ============================================================
   state
   ============================================================ */
const BANDS = ['K-2','3-5','6-8','9-10','11-12'];
const SC = {A:'var(--A)',B:'var(--B)',C:'var(--C)',D:'var(--D)',E:'var(--E)'};
const HEX = {A:'#2f6f8f',B:'#44764f',C:'#9a6b1f',D:'#9c4337',E:'#59497f'};
const v1By = Object.fromEntries(DATA.v1.map(n=>[n.code,n]));
const v2By = Object.fromEntries(DATA.v2.map(n=>[n.code,n]));
const compsByConcept = {};
DATA.comps.forEach(c=>{ (compsByConcept[c.concept] ||= []).push(c); });

const state = { dir:'f', band:'all', view:'d', focus:null, basket:new Set() };

/* ============================================================
   tally
   ============================================================ */
const S = DATA.stats;
document.getElementById('tally').innerHTML = [
  [S.v1Concepts+' &rarr; '+S.v2Concepts, 'concepts, V1 to V2'],
  [S.v1Comp+' &rarr; '+S.v2Comp, 'competencies'],
  [S.links, 'connections between them'],
  [S.crossStrandComp, 'competencies that changed strand'],
].map(([b,l])=>`<div><b>${b}</b><span>${l}</span></div>`).join('');



/* ============================================================
   legend
   ============================================================ */
document.getElementById('legend').innerHTML =
  Object.entries(DATA.v2Strand).map(([k,v])=>
    `<span><i class="sw" style="background:${HEX[k]}"></i>${k} &middot; ${v.name}</span>`).join('')
  + `<span style="color:var(--faint)">Ribbon thickness = competencies carried</span>`;

/* ============================================================
   band filter buttons
   ============================================================ */
const bandSeg = document.getElementById('bandSeg');
bandSeg.innerHTML = ['all',...BANDS].map(b=>
  `<button data-band="${b}" aria-pressed="${b==='all'}">${b==='all'?'All':b}</button>`).join('');
bandSeg.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  state.band=b.dataset.band;
  [...bandSeg.children].forEach(x=>x.setAttribute('aria-pressed',x===b));
  render();
});

/* ============================================================
   link filtering
   ============================================================ */
function linkWeight(l){
  if(state.band==='all') return l.n;
  return l.ids.filter(id=>id.startsWith(state.band+'.')).length;
}
function activeLinks(){
  return DATA.links.map(l=>({...l,w:linkWeight(l)})).filter(l=>l.w>0);
}
function conceptComp(code,side){
  const n = side==='v1'? v1By[code] : v2By[code];
  if(state.band==='all') return n.comp;
  return n.gb[BANDS.indexOf(state.band)];
}

/* ============================================================
   diagram
   ============================================================ */
const UNIT=1.45, GAP=4, SUBGAP=13, TOP=46, COLW=11, MIDW=330;
const LEFTPAD=320, RIGHTPAD=320;

function buildLayout(){
  const links=activeLinks();
  const srcSet=new Set(links.map(l=>l.s)), tgtSet=new Set(links.map(l=>l.t));

  const leftNodes = DATA.v1.filter(n=>{
